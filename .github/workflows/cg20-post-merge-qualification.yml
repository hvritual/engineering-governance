name: CG-20 post-merge execution qualification

on:
  push:
    branches:
      - cg20/controlled-merge-execution
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CG20_AUTHORIZATION_B64: 
  CG20_REQUEST_B64: 
  CG20_RECEIPT_B64: 

jobs:
  qualify:
    name: qualify-post-merge-consumption
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify post-merge execution and one-time consumption
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, copy, importlib.util, json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path('prevention/cg20').resolve()))
          def loadmod(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          p20m=loadmod('p20m','prevention/cg20/prepare_merge.py')
          v20=loadmod('v20','prevention/cg20/verify_merge.py')
          protocol=json.load(open('prevention/cg20/protocol.json'))
          auth=json.loads(base64.b64decode(os.environ['CG20_AUTHORIZATION_B64']))
          request=json.loads(base64.b64decode(os.environ['CG20_REQUEST_B64']))
          receipt=json.loads(base64.b64decode(os.environ['CG20_RECEIPT_B64']))
          token=os.environ['GITHUB_TOKEN']

          out=v20.verify(protocol,auth,request,receipt,token)
          assert out['status']=='MERGE_EXECUTION_ATTESTED'
          assert out['decision']=='CONTROLLED_MERGE_EXECUTION_VERIFIED'
          assert out['authorizationConsumption']=='CONSUMED_BY_SUCCESSFUL_MERGE'
          assert out['authorizationUseCount']==1 and out['consumptionState']=='CONSUMED'
          assert out['mergeSha']=='079a14ecfb40574c25b182118428c33b82da7082'
          assert out['postMergeBaseSha']==out['mergeSha']
          assert out['mergeParentSha']=='916b33608d6cc0dc2eb48549e82b072b114473a2'
          assert out['mergeTreeSha']==out['headTreeSha']
          print('CG20_EXECUTION_ATTESTATION_ID='+out['executionAttestationId'])
          print('CG20_MERGE_SHA='+out['mergeSha'])
          print('CG20_MERGE_TREE='+out['mergeTreeSha'])
          print('CG20_AUTHORIZATION_CONSUMPTION='+out['authorizationConsumption'])
          print('CG20_POST_MERGE_VERIFY=PASS')

          try:
              p20m.prepare(protocol,auth,token)
          except p20m.MergeExecutionPreparationError as exc:
              assert exc.reason=='PULL_REQUEST_ALREADY_MERGED',(exc.reason,exc.detail)
          else:
              raise AssertionError('same authorization unexpectedly prepared after successful merge')
          print('CG20_REPLAY_FAIL_CLOSED=PASS')

          bad=copy.deepcopy(receipt); bad['requestId']='0'*64
          bad['receiptId']=v20.canonical_digest(v20.receipt_core(bad))
          try: v20.verify(protocol,auth,request,bad,token)
          except v20.MergeExecutionVerificationError as exc: assert exc.reason=='RECEIPT_REQUEST_BINDING_MISMATCH'
          else: raise AssertionError('wrong request receipt accepted')

          bad=copy.deepcopy(receipt); bad['mergeSha']='0'*40
          bad['receiptId']=v20.canonical_digest(v20.receipt_core(bad))
          try: v20.verify(protocol,auth,request,bad,token)
          except v20.MergeExecutionVerificationError as exc: assert exc.reason=='PROVIDER_MERGE_SHA_MISMATCH',(exc.reason,exc.detail)
          else: raise AssertionError('wrong provider merge sha accepted')
          print('CG20_POST_MERGE_NEGATIVE_MATRIX=PASS')

          reader=v20.GitHubReader(token)
          main=reader.get('/repos/hvritual/engineering-governance/git/ref/heads/main')
          assert (main.get('object') or {}).get('sha')=='916b33608d6cc0dc2eb48549e82b072b114473a2',main
          print('CG20_MAIN_UNCHANGED=PASS')
          print('CG20_CONSUMER_MUTATION=NONE')
          PY

      - name: Stable asset syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool prevention/cg20/protocol.json >/dev/null
          python3 -m json.tool prevention/cg20/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ['prevention/cg20/prepare_merge.py','prevention/cg20/verify_merge.py']:
              ast.parse(Path(p).read_text(),filename=p)
          PY
          git diff --exit-code
          echo 'CG20_STABLE_ASSETS=PASS'
