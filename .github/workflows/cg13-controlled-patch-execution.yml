name: CG-13 controlled patch execution qualification

on:
  push:
    branches:
      - cg13/controlled-patch-execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-controlled-patch-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-12 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:prevention/cg12/protocol.json)" = "42de586a1c4d78d36736b11292e5cabcfab515c2"
          test "$(git rev-parse HEAD:prevention/cg12/subjects.json)" = "45f87bc2bea33758079d8cc2dc9518b1e617b4a5"
          test "$(git rev-parse HEAD:prevention/cg12/reconcile_state.py)" = "1fd3a4b2e13affdc1abfbd2bde807c7caf40a541"
          test "$(git rev-parse HEAD:prevention/cg12/verify_reconciliation.py)" = "85b2364c33bf59570c808d0eeec7e87208a6259a"
          python3 - <<'PY'
          import json
          p=json.load(open('prevention/cg12/protocol.json'))
          assert p['status']=='QUALIFIED', p
          PY
          echo 'CG13_CG12_SOURCE_AUTHORITIES=PASS'

      - name: Qualify real refusal and isolated execution lanes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          def loadmod(name, path):
              spec=importlib.util.spec_from_file_location(name, path)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          execute=loadmod('cg13_execute', 'prevention/cg13/execute_patch.py')
          verify=loadmod('cg13_verify', 'prevention/cg13/verify_execution.py')
          protocol=json.load(open('prevention/cg13/protocol.json'))
          cases=json.load(open('prevention/cg13/cases.json'))
          assert protocol['status'] in ('CANDIDATE','QUALIFIED')
          assert cases['qualificationFixture']['qualificationOnly'] is True
          assert cases['qualificationFixture']['consumerEvidence'] is False

          for case in cases['realCurrentStateRefusals']:
              try:
                  execute.validate_receipt(protocol, case['receipt'])
              except execute.ExecutionError as exc:
                  assert exc.reason == case['expectedReason'], (case['caseId'], exc.reason)
              else:
                  raise AssertionError('real current-state receipt unexpectedly executable: '+case['caseId'])
          print('CG13_REAL_CURRENT_STATE_REFUSAL=PASS')

          def git(repo, *args, check=True):
              cp=subprocess.run(['git','-C',str(repo),*args], capture_output=True, text=True)
              if check and cp.returncode:
                  raise AssertionError((args, cp.stderr))
              return cp

          def init_fixture(root):
              fixture=cases['qualificationFixture']
              repo=Path(root)/'repo'
              repo.mkdir()
              git(repo,'init','-q','-b','main')
              git(repo,'config','user.email','cg13@example.invalid')
              git(repo,'config','user.name','CG13 Qualification')
              git(repo,'remote','add','origin','https://github.com/hvritual/cg13-fixture.git')
              for rel, content in fixture['initialFiles'].items():
                  path=repo/rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
              git(repo,'add','.')
              git(repo,'commit','-qm','base')
              base=git(repo,'rev-parse','HEAD').stdout.strip()
              git(repo,'switch','-qc',fixture['workBranch'])
              receipt={
                  'caseId':fixture['caseId'],
                  'authorizationStatus':'AUTHORIZED',
                  'repository':fixture['repository'],
                  'baseSha':base,
                  'workBranch':fixture['workBranch'],
                  'allowedPaths':fixture['allowedPaths'],
                  'preservedVerificationClasses':fixture['preservedVerificationClasses'],
                  'disposition':'PATCH_REQUIRED_ON_AUTHORIZED_BRANCH_ONLY',
                  'patchRequired':True,
                  'consumerMutation':False,
                  'directMainUpdate':False,
                  'mergeAuthorization':False,
                  'repositoryAdministration':False,
                  'consumerAdoption':False,
              }
              return repo, receipt

          def make_patch(repo, changes):
              for rel, content in changes.items():
                  path=repo/rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
              patch=subprocess.check_output(['git','-C',str(repo),'diff'])
              subprocess.run(['git','-C',str(repo),'checkout','--','.'], check=True)
              path=repo.parent/'patch.diff'
              path.write_bytes(patch)
              return path

          def happy(root):
              fixture=cases['qualificationFixture']
              repo, receipt=init_fixture(root)
              patch=make_patch(repo, fixture['patchedFiles'])
              execution=execute.execute(protocol, receipt, repo, patch)
              verification={
                  'schemaVersion':1,
                  'caseId':receipt['caseId'],
                  'repository':receipt['repository'],
                  'baseSha':receipt['baseSha'],
                  'workBranch':receipt['workBranch'],
                  'changedPaths':execution['changedPaths'],
                  'diffSha256':execution['diffSha256'],
                  'checks':[
                      {'class':'FIXTURE_BEHAVIOR_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg13-behavior').hexdigest()},
                      {'class':'FIXTURE_STATIC_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg13-static').hexdigest()},
                  ],
              }
              attestation=verify.verify(protocol, receipt, execution, verification, repo)
              assert attestation['status']=='PATCH_EXECUTION_ATTESTED', attestation
              assert attestation['decision']=='CONTROLLED_PATCH_EXECUTION_VERIFIED', attestation
              assert attestation['changedPaths']==['src/allowed.txt'], attestation
              return repo, receipt, patch, execution, verification, attestation

          with tempfile.TemporaryDirectory() as root:
              repo, receipt, patch, execution, verification, attestation=happy(root)
              print('CG13_FIXTURE_ATTESTATION_ID='+attestation['attestationId'])
              print('CG13_ISOLATED_PATCH_EXECUTION=PASS')

          def expect_execute(reason, mutate_receipt=None, prepare=None, patch_changes=None, patch_bytes=None):
              with tempfile.TemporaryDirectory() as root:
                  repo, receipt=init_fixture(root)
                  if mutate_receipt:
                      mutate_receipt(receipt)
                  if prepare:
                      prepare(repo, receipt)
                  if patch_bytes is not None:
                      patch=Path(root)/'patch.diff'
                      patch.write_bytes(patch_bytes)
                  else:
                      patch=make_patch(repo, patch_changes or cases['qualificationFixture']['patchedFiles'])
                  try:
                      execute.execute(protocol, receipt, repo, patch)
                  except execute.ExecutionError as exc:
                      assert exc.reason==reason, (reason, exc.reason, exc.detail)
                      return
                  raise AssertionError('expected rejection '+reason)

          expect_execute('PATCH_REQUIRED_TRUE_REQUIRED', lambda r:r.__setitem__('patchRequired',False))
          expect_execute('LIVE_BASE_SHA_MISMATCH', lambda r:r.__setitem__('baseSha','0'*40))
          expect_execute('WORK_BRANCH_MISMATCH', prepare=lambda repo,r:git(repo,'switch','-q','main'))
          expect_execute('WORKTREE_NOT_CLEAN_AT_START', prepare=lambda repo,r:(repo/'dirty.tmp').write_text('x'))
          expect_execute('PATCH_FILE_EMPTY_OR_MISSING', patch_bytes=b'')
          expect_execute('PATCH_PATH_OUTSIDE_ALLOWLIST', lambda r:r.__setitem__('allowedPaths',['src/other.txt']))
          expect_execute('FORBIDDEN_PATH', lambda r:r.__setitem__('allowedPaths',['server/blocked.txt']))
          expect_execute('DIRECT_MAIN_UPDATE_FORBIDDEN', lambda r:r.__setitem__('directMainUpdate',True))
          expect_execute('MERGE_AUTHORIZATION_FORBIDDEN', lambda r:r.__setitem__('mergeAuthorization',True))
          expect_execute('REPOSITORY_ADMINISTRATION_FORBIDDEN', lambda r:r.__setitem__('repositoryAdministration',True))
          expect_execute('CONSUMER_ADOPTION_FORBIDDEN', lambda r:r.__setitem__('consumerAdoption',True))

          with tempfile.TemporaryDirectory() as root:
              repo, receipt=init_fixture(root)
              (repo/'src/new.txt').write_text('new\n')
              git(repo,'add','src/new.txt')
              patch=Path(root)/'create.patch'
              patch.write_bytes(subprocess.check_output(['git','-C',str(repo),'diff','--cached']))
              git(repo,'reset','-q','HEAD')
              (repo/'src/new.txt').unlink()
              receipt['allowedPaths']=['src/new.txt']
              try:
                  execute.execute(protocol, receipt, repo, patch)
              except execute.ExecutionError as exc:
                  assert exc.reason=='PATCH_CREATE_FILE_FORBIDDEN', (exc.reason, exc.detail)
              else:
                  raise AssertionError('new-file patch unexpectedly allowed')

          with tempfile.TemporaryDirectory() as root:
              repo, receipt=init_fixture(root)
              receipt['allowedPaths']=['src/allowed.txt','src/renamed.txt']
              git(repo,'mv','src/allowed.txt','src/renamed.txt')
              git(repo,'add','-A')
              patch=Path(root)/'rename.patch'
              patch.write_bytes(subprocess.check_output(['git','-C',str(repo),'diff','--cached']))
              git(repo,'reset','-q','HEAD')
              git(repo,'checkout','--','.')
              if (repo/'src/renamed.txt').exists():
                  (repo/'src/renamed.txt').unlink()
              try:
                  execute.execute(protocol, receipt, repo, patch)
              except execute.ExecutionError as exc:
                  assert exc.reason=='PATCH_RENAME_FORBIDDEN', (exc.reason, exc.detail)
              else:
                  raise AssertionError('rename patch unexpectedly allowed')

          def expect_verify(reason, mutate=None, mutate_repo=None):
              with tempfile.TemporaryDirectory() as root:
                  repo, receipt, patch, execution, verification, attestation=happy(root)
                  if mutate:
                      mutate(receipt, execution, verification)
                  if mutate_repo:
                      mutate_repo(repo)
                  try:
                      verify.verify(protocol, receipt, execution, verification, repo)
                  except verify.AttestationError as exc:
                      assert exc.reason==reason, (reason, exc.reason, exc.detail)
                      return
                  raise AssertionError('expected attestation rejection '+reason)

          expect_verify('VERIFICATION_CLASS_SET_MISMATCH', lambda r,e,v:v.__setitem__('checks',v['checks'][:-1]))
          expect_verify('VERIFICATION_NOT_PASS', lambda r,e,v:v['checks'][0].__setitem__('outcome','FAIL'))
          expect_verify('VERIFICATION_EVIDENCE_DIGEST_INVALID', lambda r,e,v:v['checks'][0].__setitem__('evidenceSha256','bad'))
          expect_verify('COMMIT_AUTHORIZATION_FORBIDDEN', lambda r,e,v:e.__setitem__('commitAuthorization','GRANTED'))
          expect_verify('PULL_REQUEST_AUTHORIZATION_FORBIDDEN', lambda r,e,v:e.__setitem__('pullRequestAuthorization','GRANTED'))
          expect_verify('MERGE_AUTHORIZATION_FORBIDDEN', lambda r,e,v:e.__setitem__('mergeAuthorization','GRANTED'))
          expect_verify('SOURCE_RECONCILIATION_DIGEST_MISMATCH', lambda r,e,v:r.__setitem__('reason','tampered'))
          expect_verify('EXECUTION_DIFF_DIGEST_MISMATCH', mutate_repo=lambda repo:(repo/'src/allowed.txt').write_text('three\n'))

          print('CG13_NEGATIVE_MATRIX=PASS')
          PY

      - name: Stable asset syntax and governance cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool prevention/cg13/protocol.json >/dev/null
          python3 -m json.tool prevention/cg13/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in ['prevention/cg13/execute_patch.py','prevention/cg13/verify_execution.py']:
              ast.parse(Path(path).read_text(), filename=path)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG13_CONSUMER_MUTATION=NONE'
          echo 'CG13_STABLE_ASSETS=PASS'
