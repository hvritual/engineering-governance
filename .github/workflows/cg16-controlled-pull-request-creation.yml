name: CG-16 controlled pull request creation qualification

on:
  push:
    branches:
      - cg16/controlled-pull-request-creation
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: qualify-controlled-pull-request-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-15 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:prevention/cg15/protocol.json)" = "0dfab6fd9d75ba2aefa21d23b0e3a53089458f5c"
          test "$(git rev-parse HEAD:prevention/cg15/cases.json)" = "61f34e01cbbfdeaf72d1eab433c4e08a5849d1fd"
          test "$(git rev-parse HEAD:prevention/cg15/publish_branch.py)" = "0b935fc0e748e5fbac75a0aac0ca4f2c6dd4d897"
          test "$(git rev-parse HEAD:prevention/cg15/verify_publication.py)" = "9aa3b0783c793ebe9d0409ce253533135347acd3"
          python3 - <<'PY'
          import json
          assert json.load(open('prevention/cg15/protocol.json'))['status']=='QUALIFIED'
          PY
          echo 'CG16_CG15_SOURCE_AUTHORITIES=PASS'

      - name: Qualify request construction or external execution readback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_BASE_SHA: 59b0e1edbd08b953d8d8f68d9610a13de797c10e
          QUALIFICATION_REPOSITORY: hvritual/engineering-governance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, importlib.util, json, os, subprocess, tempfile
          from pathlib import Path

          def loadmod(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod

          e13=loadmod('e13','prevention/cg13/execute_patch.py')
          v13=loadmod('v13','prevention/cg13/verify_execution.py')
          p14m=loadmod('p14m','prevention/cg14/package_commit.py')
          v14=loadmod('v14','prevention/cg14/verify_commit.py')
          p15m=loadmod('p15m','prevention/cg15/publish_branch.py')
          v15=loadmod('v15','prevention/cg15/verify_publication.py')
          c16=loadmod('c16','prevention/cg16/create_pull_request.py')
          v16=loadmod('v16','prevention/cg16/verify_pull_request.py')
          p13=json.load(open('prevention/cg13/protocol.json'))
          p14=json.load(open('prevention/cg14/protocol.json'))
          p15=json.load(open('prevention/cg15/protocol.json'))
          c15=json.load(open('prevention/cg15/cases.json'))
          p16=json.load(open('prevention/cg16/protocol.json'))
          cases=json.load(open('prevention/cg16/cases.json'))
          fixture=cases['qualificationFixture']
          token=os.environ['GITHUB_TOKEN']
          repository=os.environ['QUALIFICATION_REPOSITORY']
          base_sha=os.environ['QUALIFICATION_BASE_SHA']
          clean_url='https://github.com/'+repository+'.git'
          basic=base64.b64encode(('x-access-token:'+token).encode()).decode()
          os.environ['GIT_CONFIG_COUNT']='1'
          os.environ['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          os.environ['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+basic

          def git(repo,*args,check=True):
              cp=subprocess.run(['git','-C',str(repo),*args],capture_output=True,text=True)
              if check and cp.returncode: raise AssertionError((args,cp.stdout,cp.stderr))
              return cp

          current={x['caseId']:x['currentDisposition'] for x in c15['realCurrentStateRefusals']}
          for case in cases['realCurrentStateRefusals']:
              assert current[case['caseId']]==case['currentDisposition']
              try: c16.validate_source_attestation(p16,case['sourcePublicationAttestation'])
              except c16.PullRequestCreationError as exc: assert exc.reason==case['expectedReason'],(case,exc.reason)
              else: raise AssertionError('real subject unexpectedly PR-eligible')
          print('CG16_REAL_CURRENT_STATE_REFUSAL=PASS')

          external_path=Path('prevention/cg16/qualification-external.json')
          if not external_path.exists():
              run_id=os.environ['GITHUB_RUN_ID']; attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
              work_branch=fixture['workBranchPrefix']+run_id+'-'+attempt
              with tempfile.TemporaryDirectory() as root:
                  root=Path(root); repo=root/'repo'; repo.mkdir()
                  git(repo,'init','-q','-b','main'); git(repo,'remote','add','origin',clean_url); git(repo,'fetch','-q','origin','main'); git(repo,'checkout','-q','-B','main',base_sha)
                  git(repo,'config','user.email','cg16@example.invalid'); git(repo,'config','user.name','CG16 Qualification'); git(repo,'config','commit.gpgsign','false')
                  assert git(repo,'ls-remote','--refs','origin','refs/heads/main').stdout.split()[0]==base_sha
                  git(repo,'switch','-qc',work_branch)
                  target=repo/fixture['allowedPaths'][0]; target.write_text(target.read_text()+'\n')
                  patch=root/'patch.diff'; patch.write_bytes(subprocess.check_output(['git','-C',str(repo),'diff'])); git(repo,'checkout','--','.')
                  auth={'caseId':'CG16-REAL-GITHUB-PR-QUALIFICATION','authorizationStatus':'AUTHORIZED','repository':repository,'baseSha':base_sha,'workBranch':work_branch,'allowedPaths':fixture['allowedPaths'],'preservedVerificationClasses':fixture['verificationClasses'],'disposition':'PATCH_REQUIRED_ON_AUTHORIZED_BRANCH_ONLY','patchRequired':True,'consumerMutation':False,'directMainUpdate':False,'mergeAuthorization':False,'repositoryAdministration':False,'consumerAdoption':False}
                  ex=e13.execute(p13,auth,repo,patch)
                  vr={'schemaVersion':1,'caseId':auth['caseId'],'repository':repository,'baseSha':base_sha,'workBranch':work_branch,'changedPaths':ex['changedPaths'],'diffSha256':ex['diffSha256'],'checks':[{'class':'FIXTURE_BEHAVIOR_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg16-behavior').hexdigest()},{'class':'FIXTURE_STATIC_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg16-static').hexdigest()}]}
                  patch_att=v13.verify(p13,auth,ex,vr,repo)
                  commit_receipt=p14m.package_commit(p14,patch_att,repo,fixture['commitMessage'])
                  commit_att=v14.verify(p14,patch_att,commit_receipt,repo)
                  pub_receipt=p15m.publish(p15,commit_att,repo)
                  pub_att=v15.verify(p15,commit_att,pub_receipt,repo)
                  title=fixture['pullRequestTitlePrefix']+' '+run_id+'-'+attempt
                  request=c16.build_request(p16,pub_att,repo,title,fixture['pullRequestBody'],token)
                  assert request['status']=='PULL_REQUEST_CREATION_REQUEST_READY'
                  # prove builder did not create a PR
                  owner=repository.split('/',1)[0]
                  import urllib.parse
                  q=urllib.parse.urlencode({'state':'open','head':owner+':'+work_branch,'base':'main','per_page':100})
                  assert c16.GitHubReader(token).get('/repos/'+repository+'/pulls?'+q)==[]
                  try: c16.validate_source_attestation(p16,{**pub_att,'publicationAttestationId':'0'*64})
                  except c16.PullRequestCreationError as exc: assert exc.reason=='CG15_PUBLICATION_ATTESTATION_ID_MISMATCH'
                  else: raise AssertionError('tampered source accepted')
                  try: c16.build_request(p16,pub_att,repo,'',fixture['pullRequestBody'],token)
                  except c16.PullRequestCreationError as exc: assert exc.reason=='PULL_REQUEST_TITLE_INVALID'
                  else: raise AssertionError('invalid title accepted')
                  print('CG16_EXTERNAL_BRANCH='+work_branch)
                  print('CG16_EXTERNAL_SOURCE_B64='+base64.b64encode(json.dumps(pub_att,sort_keys=True,separators=(',',':')).encode()).decode())
                  print('CG16_EXTERNAL_REQUEST_B64='+base64.b64encode(json.dumps(request,sort_keys=True,separators=(',',':')).encode()).decode())
                  print('CG16_REQUEST_BUILDER_SIDE_EFFECT_FREE=PASS')
                  print('CG16_AWAITING_TRUSTED_EXTERNAL_EXECUTOR=PASS')
          else:
              bundle=json.load(open(external_path))
              assert bundle['qualificationOnly'] is True and bundle['consumerEvidence'] is False
              source=bundle['sourceAttestation']; request=bundle['request']; receipt=bundle['externalReceipt']
              assert request['requestId']==receipt['requestId']
              with tempfile.TemporaryDirectory() as root:
                  repo=Path(root)/'repo'; repo.mkdir()
                  git(repo,'init','-q','-b','main'); git(repo,'remote','add','origin',clean_url); git(repo,'fetch','-q','origin','main',source['workBranch'])
                  git(repo,'checkout','-q','-B',source['workBranch'],source['commitSha'])
                  out=v16.verify(p16,source,request,receipt,repo,token)
                  assert out['status']=='PULL_REQUEST_ATTESTED' and out['decision']=='CONTROLLED_PULL_REQUEST_CREATION_VERIFIED'
                  print('CG16_QUALIFICATION_PR_NUMBER='+str(out['pullRequestNumber']))
                  print('CG16_FIXTURE_PR_ATTESTATION_ID='+out['pullRequestAttestationId'])
                  print('CG16_REAL_GITHUB_PR_READBACK=PASS')

                  def expect(reason, mutate_request=None, mutate_receipt=None):
                      rq=json.loads(json.dumps(request)); er=json.loads(json.dumps(receipt))
                      if mutate_request: mutate_request(rq)
                      if mutate_receipt: mutate_receipt(er)
                      try: v16.verify(p16,source,rq,er,repo,token)
                      except v16.PullRequestAttestationError as exc: assert exc.reason==reason,(reason,exc.reason,exc.detail); return
                      raise AssertionError('expected '+reason)

                  expect('PULL_REQUEST_REQUEST_ID_MISMATCH',mutate_request=lambda r:r.__setitem__('requestId','0'*64))
                  expect('EXTERNAL_REQUEST_ID_MISMATCH',mutate_receipt=lambda r:r.__setitem__('requestId','0'*64))
                  expect('MERGE_AUTHORIZATION_FORBIDDEN',mutate_receipt=lambda r:r.__setitem__('mergeAuthorization','GRANTED'))
                  bad=json.loads(json.dumps(request)); bad['headSha']='0'*40; core=v16.request_core(bad); bad['requestId']=v16.canonical_digest(core)
                  try: v16.verify(p16,source,bad,receipt,repo,token)
                  except v16.PullRequestAttestationError as exc: assert exc.reason=='PULL_REQUEST_REQUEST_SOURCE_BINDING_MISMATCH',(exc.reason,exc.detail)
                  else: raise AssertionError('request head drift accepted')
                  print('CG16_NEGATIVE_MATRIX=PASS')

                  if p16['status']=='QUALIFIED':
                      deleted=git(repo,'push','-q','origin',':refs/heads/'+source['workBranch'],check=False)
                      assert deleted.returncode==0,(deleted.stdout,deleted.stderr)
                      assert git(repo,'ls-remote','--refs','origin','refs/heads/'+source['workBranch']).stdout.strip()==''
                      assert git(repo,'ls-remote','--refs','origin','refs/heads/main').stdout.split()[0]==source['baseSha']
                      print('CG16_QUALIFICATION_BRANCH_CLEANUP=PASS')
          print('CG16_CONSUMER_MUTATION=NONE')
          PY

      - name: Stable asset syntax and governance cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool prevention/cg16/protocol.json >/dev/null
          python3 -m json.tool prevention/cg16/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in ['prevention/cg16/create_pull_request.py','prevention/cg16/verify_pull_request.py']:
              ast.parse(Path(path).read_text(),filename=path)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG16_STABLE_ASSETS=PASS'
