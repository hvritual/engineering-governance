name: CG-20 qualification cleanup

on:
  push:
    branches:
      - cg20/controlled-merge-execution
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cleanup:
    name: cleanup-cg20-qualification-branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate protocol
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Delete disposable qualification refs and prove main unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          assert json.load(open('prevention/cg20/protocol.json'))['status']=='QUALIFIED'
          PY
          api="https://api.github.com/repos/hvritual/engineering-governance"
          auth="Authorization: Bearer ${GH_TOKEN}"
          ver="X-GitHub-Api-Version: 2022-11-28"
          accept="Accept: application/vnd.github+json"
          for ref in cg20-qualification/head cg20-qualification/base; do
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "$auth" -H "$ver" -H "$accept" "$api/git/refs/heads/$ref")
            test "$code" = "204"
            code=$(curl -sS -o /tmp/read.json -w '%{http_code}' -H "$auth" -H "$ver" -H "$accept" "$api/git/ref/heads/$ref")
            test "$code" = "404"
          done
          main=$(curl -sS -H "$auth" -H "$ver" -H "$accept" "$api/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$main" = "916b33608d6cc0dc2eb48549e82b072b114473a2"
          echo 'CG20_QUALIFICATION_BRANCH_CLEANUP=PASS'
          echo 'CG20_MAIN_UNCHANGED_AFTER_CLEANUP=PASS'
