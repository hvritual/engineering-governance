name: CG-04 Consumer Adoption Qualification

on:
  push:
    branches: [cg-04/consumer-adoption-upgrade]
    paths:
      - adoption/cg04/**
      - .github/workflows/cg04-consumer-adoption.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONSUMER_SHA: bcd20632b666405c3f7a8fe8d53f591c78450087
      YUNKA_SHA: 057ebcf88a87303eb633eb6e604d306f633dfac0
      AST_GREP_VERSION: 0.45.3
      AST_GREP_ASSET_SHA256: f8ac830881339d1edee6b2652f54798c0f4da5a827f2db38a08ee31117783ce8
      PROFILE: adoption/cg04/hvritual/iot-delivery-system/profile.json
      LOCK: adoption/cg04/hvritual/iot-delivery-system/lock.json
      PROTOCOL: adoption/cg04/protocol.json

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: governance
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hvritual/iot-delivery-system
          ref: ${{ env.CONSUMER_SHA }}
          path: consumer
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: false

      - name: Resolve active profile and immutable lock
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cg04"
          mkdir -p "$out/logs" "$out/tools" "$out/snapshots"

          test "$(git -C consumer rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git -C consumer rev-parse HEAD:third_party/yunka)" = "$YUNKA_SHA"

          cp "governance/$PROFILE" "$out/snapshots/profile.json"
          cp "governance/$LOCK" "$out/snapshots/lock.json"
          cp "governance/$PROTOCOL" "$out/snapshots/protocol.json"

          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('governance')
          profile=json.loads((root/os.environ['PROFILE']).read_text())
          lock=json.loads((root/os.environ['LOCK']).read_text())
          protocol=json.loads((root/os.environ['PROTOCOL']).read_text())

          assert profile['status']=='CANDIDATE'
          assert lock['status']=='LOCKED_PENDING_QUALIFICATION'
          assert protocol['status']=='CANDIDATE'
          assert profile['selection']['assetId']==lock['asset']['id']
          assert profile['selection']['requestedVersion']==lock['asset']['version']
          assert profile['consumer']['repository']=='hvritual/iot-delivery-system'
          assert profile['consumer']['requiresConsumerRepositoryChange'] is False
          assert profile['consumer']['requiresConsumerScaffoldUpgrade'] is False
          assert profile['consumer']['requiresYunkaUpgrade'] is False

          def blob(path):
            return subprocess.check_output(['git','-C','governance','rev-parse',f'HEAD:{path}'],text=True).strip()

          a=lock['asset']; t=lock['tool']
          assert blob(a['preventionPath'])==a['preventionBlob']
          assert blob(a['problemPath'])==a['problemBlob']
          assert blob(a['rulePath'])==a['ruleBlob']
          assert blob('corpus/cg01/iot-sqlite-startup/case.json')==a['qualificationCorpusBlob']
          assert blob('admission/cg02/decision.json')==t['admissionDecisionBlob']

          prevention=json.loads((root/a['preventionPath']).read_text())
          assert prevention['status']=='QUALIFIED'
          assert prevention['id']==a['id'] and prevention['version']==a['version']
          assert prevention['rule']['engine']==t['name']
          assert prevention['rule']['engineVersion']==t['version']
          assert prevention['rule']['linuxAmd64AssetSha256']==t['linuxAmd64AssetSha256']
          assert prevention['rule']['path']==a['rulePath']

          result={
            'profileId':profile['id'],
            'lockId':lock['id'],
            'assetId':a['id'],
            'assetVersion':a['version'],
            'resolvedBlobs':{
              'prevention':a['preventionBlob'],
              'problem':a['problemBlob'],
              'rule':a['ruleBlob']
            },
            'tool':{'name':t['name'],'version':t['version'],'digest':t['linuxAmd64AssetSha256']},
            'status':'PASS'
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','lock-resolution.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

          find consumer -type f \( -name go.mod -o -name go.sum -o -name go.work -o -name go.work.sum \) -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-before.sha256"
          git -C consumer status --porcelain --untracked-files=all > "$out/consumer-status-before.txt"
          test ! -s "$out/consumer-status-before.txt"

      - name: Install exact locked detector
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cg04"
          curl -fsSL "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip" -o "$out/tools/ast-grep.zip"
          echo "$AST_GREP_ASSET_SHA256  $out/tools/ast-grep.zip" | sha256sum -c -
          unzip -q "$out/tools/ast-grep.zip" -d "$out/tools/bin"
          sg="$out/tools/bin/ast-grep"
          test -x "$sg"
          "$sg" --version | tee "$out/logs/ast-grep.version.txt"
          sha256sum "$sg" > "$out/logs/ast-grep.binary.sha256"

      - name: Verify exact consumer source with active lock
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cg04"
          sg="$out/tools/bin/ast-grep"
          rule="$GITHUB_WORKSPACE/governance/prevention/cg03/iot-sqlite-startup/rule.yml"
          target="$GITHUB_WORKSPACE/consumer/backend-yunka/internal/delivery/sqlite_repository.go"

          set +e
          "$sg" scan -r "$rule" --json=compact "$target" > "$out/logs/static.stdout" 2> "$out/logs/static.stderr"
          static_code=$?
          set -e
          printf '%s\n' "$static_code" > "$out/logs/static.exit"

          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','logs','static.stdout')
          text=p.read_text().strip()
          data=json.loads(text) if text else []
          rid='cg03-sqlite-busy-timeout-before-wal'
          def hits(v):
            if isinstance(v,dict):
              return (1 if v.get('ruleId')==rid else 0)+sum(hits(x) for x in v.values())
            if isinstance(v,list): return sum(hits(x) for x in v)
            return 0
          n=hits(data)
          assert n==0, f'active consumer has recurrence findings: {n}'
          pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','static-result.json').write_text(json.dumps({'status':'PASS','findings':n},indent=2)+'\n')
          PY

          (
            cd consumer/backend-yunka
            GOWORK=off GOFLAGS=-mod=readonly go test -json -count=1 -run '^TestAG03SQLiteStartupWaitsForExternalLock$' ./internal/delivery
          ) > "$out/logs/behavior.jsonl"

          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','logs','behavior.jsonl')
          name='TestAG03SQLiteStartupWaitsForExternalLock'
          seen=False; passed=False; package_pass=False
          for line in p.read_text().splitlines():
            try: e=json.loads(line)
            except json.JSONDecodeError: continue
            if e.get('Test')==name:
              seen=True
              if e.get('Action')=='pass': passed=True
            if e.get('Action')=='pass' and not e.get('Test'): package_pass=True
          assert seen and passed and package_pass, (seen,passed,package_pass)
          pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','behavior-result.json').write_text(json.dumps({'status':'PASS','test':name,'executed':seen,'passed':passed},indent=2)+'\n')
          PY

      - name: Exercise upgrade preview and rollback semantics
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cg04"
          python3 - <<'PY'
          import copy, json, os, pathlib, subprocess
          root=pathlib.Path('governance')
          lock=json.loads((root/os.environ['LOCK']).read_text())
          prevention=json.loads((root/lock['asset']['preventionPath']).read_text())

          def blob(path):
            return subprocess.check_output(['git','-C','governance','rev-parse',f'HEAD:{path}'],text=True).strip()

          def resolve(candidate):
            a=candidate['asset']; t=candidate['tool']
            if a['version']!=prevention['version'] or a['id']!=prevention['id']:
              return {'status':'REJECTED','reason':'UNQUALIFIED_OR_NONEXISTENT_VERSION'}
            expected={
              'preventionBlob':blob(a['preventionPath']),
              'problemBlob':blob(a['problemPath']),
              'ruleBlob':blob(a['rulePath'])
            }
            for k,v in expected.items():
              if a[k]!=v: return {'status':'REJECTED','reason':'IMMUTABLE_IDENTITY_DRIFT','field':k}
            if t['name']!=prevention['rule']['engine'] or t['version']!=prevention['rule']['engineVersion']:
              return {'status':'REJECTED','reason':'UNADMITTED_TOOL_IDENTITY'}
            if t['linuxAmd64AssetSha256']!=prevention['rule']['linuxAmd64AssetSha256']:
              return {'status':'REJECTED','reason':'TOOL_DIGEST_DRIFT'}
            return {'status':'RESOLVED'}

          active=resolve(lock); assert active['status']=='RESOLVED'

          no_op=copy.deepcopy(lock)
          no_op_result=resolve(no_op); assert no_op_result['status']=='RESOLVED'
          no_op_class='NO_CHANGE' if no_op==lock else 'CHANGED'
          assert no_op_class=='NO_CHANGE'

          fake_version=copy.deepcopy(lock)
          fake_version['asset']['version']='1.0.1'
          fake_version_result=resolve(fake_version)
          assert fake_version_result=={'status':'REJECTED','reason':'UNQUALIFIED_OR_NONEXISTENT_VERSION'}

          tampered=copy.deepcopy(lock)
          tampered['asset']['ruleBlob']='0000000000000000000000000000000000000000'
          tampered_result=resolve(tampered)
          assert tampered_result['status']=='REJECTED' and tampered_result['reason']=='IMMUTABLE_IDENTITY_DRIFT'

          rollback=resolve(lock)
          assert rollback['status']=='RESOLVED'

          policy_delta={
            'noOp':[],
            'fakeVersion':['asset.version: 1.0.0 -> 1.0.1'],
            'tamperedBlob':['asset.ruleBlob: locked -> tampered']
          }
          code_delta={
            'source':'bcd20632b666405c3f7a8fe8d53f591c78450087',
            'changed':False,
            'reason':'all upgrade previews were evaluated against the same consumer source commit'
          }
          result={
            'status':'PASS',
            'activeLock':active,
            'noOpCandidate':{'classification':no_op_class,'resolution':no_op_result},
            'fakeVersionCandidate':fake_version_result,
            'tamperedBlobCandidate':tampered_result,
            'rollbackToActiveLock':rollback,
            'activeLockMutated':False,
            'policyDelta':policy_delta,
            'codeDelta':code_delta,
            'actualVersionChangingUpgrade':'NOT_APPLICABLE_NO_SECOND_QUALIFIED_VERSION'
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'cg04','upgrade-preview.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Reconcile consumer read-only state and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cg04"
          find consumer -type f \( -name go.mod -o -name go.sum -o -name go.work -o -name go.work.sum \) -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-after.sha256"
          diff -u "$out/dependency-before.sha256" "$out/dependency-after.sha256" > "$out/dependency-diff.txt"
          test -z "$(git -C consumer status --porcelain --untracked-files=all)"
          test -z "$(git -C governance status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'cg04')
          lock=json.loads((out/'snapshots/lock.json').read_text())
          profile=json.loads((out/'snapshots/profile.json').read_text())
          receipt={
            'schemaVersion':1,
            'status':'PASS',
            'task':'CG-04',
            'profileId':profile['id'],
            'lockId':lock['id'],
            'consumer':{
              'repository':profile['consumer']['repository'],
              'sourceCommit':os.environ['CONSUMER_SHA'],
              'yunkaPin':os.environ['YUNKA_SHA']
            },
            'asset':{'id':lock['asset']['id'],'version':lock['asset']['version'],'ruleBlob':lock['asset']['ruleBlob']},
            'staticVerification':json.loads((out/'static-result.json').read_text()),
            'behaviorVerification':json.loads((out/'behavior-result.json').read_text()),
            'upgradePreview':json.loads((out/'upgrade-preview.json').read_text()),
            'consumerTrackedSourceMutated':False,
            'consumerDependencyLocksMutated':False,
            'consumerScaffoldUpgradeRequired':False,
            'yunkaUpgradeRequired':False
          }
          (out/'qualification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

          rm -rf "$out/tools"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cg04-consumer-adoption-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cg04
          retention-days: 30
          if-no-files-found: error
