name: CG-28 source-issue closure execution preflight qualification

on:
  push:
    branches: [cg28/source-issue-closure-execution]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  qualify-closure-execution-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOVERNANCE_BASE: 8ce4becdabab2824d6c07bcf387a971b5061fe51
      BIZ_CG27_SHA: 3556bda199e3590046a862252d5b108927b2c53b
      BIZ_SHA: 0ad50fafe00c65e0d0442e8d8f09769b96971cfd
      BIZ_TREE: 91db8230ebaebad5a1a70df862423daf1b2f8c4e

    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: governance
          fetch-depth: 0
          persist-credentials: false

      - name: Verify governance task ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C governance rev-parse HEAD)" = "$GITHUB_SHA"
          git -C governance merge-base --is-ancestor "$GOVERNANCE_BASE" HEAD
          test "$(git -C governance rev-parse "$GOVERNANCE_BASE^{tree}")" = "58779a011c90694427e18cde68a5ae1960320bff"

      - name: Checkout exact current Biz consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/biz
          ref: ${{ env.BIZ_SHA }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read live source issue and main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          curl --fail --silent --show-error -H "$auth" -H "$accept" "${GITHUB_API_URL}/repos/hvritual/biz/issues/62" > /tmp/issue.json
          curl --fail --silent --show-error -H "$auth" -H "$accept" "${GITHUB_API_URL}/repos/hvritual/biz/branches/main" > /tmp/main.json
          python3 - <<'PY'
          import json
          issue=json.load(open('/tmp/issue.json'))
          main=json.load(open('/tmp/main.json'))
          assert issue['number']==62 and issue['state']=='open'
          assert issue['title']=='CE-13 gap: provide discoverable platform plan catalog endpoint'
          assert issue['comments']==0
          assert main['commit']['sha']=='0ad50fafe00c65e0d0442e8d8f09769b96971cfd'
          PY

      - name: Qualify fail-closed execution preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 governance/delivery/cg28/verify_execution.py \
            --protocol governance/delivery/cg28/protocol.json \
            --preflight governance/delivery/cg28/preflight.json \
            --cg27-protocol governance/delivery/cg27/protocol.json \
            --cg27-closure governance/delivery/cg27/closure.json \
            --governance-root governance \
            --biz-root biz \
            --issue-json /tmp/issue.json | tee /tmp/result.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/result.json'))
          assert r['status']=='SOURCE_ISSUE_CLOSURE_EXECUTION_PREFLIGHT_QUALIFIED', r
          assert r['decision']=='SOURCE_ISSUE_CLOSURE_EXECUTION_BLOCKED', r
          assert r['reason']=='SEMANTIC_CLOSURE_DRIFT_SINCE_CG27', r
          assert r['nextDisposition']=='REQUALIFICATION_REQUIRED_BEFORE_SOURCE_ISSUE_CLOSURE', r
          assert r['commitsAheadOfCg27']==123, r
          assert r['semanticClosureChangedPathCount']>0, r
          assert r['sourceIssueState']=='open', r
          assert r['sourceIssueClosed'] is False, r
          assert r['sourceIssueCommented'] is False, r
          assert r['consumerSourceMutation'] is False, r
          PY

      - name: Fail-closed negative matrix
        shell: bash
        run: |
          set -euo pipefail
          expect_reject() {
            expected="$1"; shift
            set +e
            "$@" >/tmp/reject.json 2>&1
            rc=$?
            set -e
            test "$rc" -eq 2 || { cat /tmp/reject.json; exit 1; }
            python3 - "$expected" <<'PY'
          import json,sys
          expected=sys.argv[1]
          r=json.load(open('/tmp/reject.json'))
          assert r['status']=='REJECTED', r
          assert r['reason']==expected, (expected,r)
          PY
          }

          python3 - <<'PY'
          import json
          issue=json.load(open('/tmp/issue.json'))
          issue['state']='closed'
          json.dump(issue,open('/tmp/issue-closed.json','w'))
          protocol=json.load(open('governance/delivery/cg28/protocol.json'))
          protocol['authorityCeiling']['sourceIssueClosureAuthorized']=True
          json.dump(protocol,open('/tmp/protocol-escalated.json','w'))
          preflight=json.load(open('governance/delivery/cg28/preflight.json'))
          preflight['execution']['sourceIssueClosed']=True
          json.dump(preflight,open('/tmp/preflight-fake-execution.json','w'))
          PY

          base=(python3 governance/delivery/cg28/verify_execution.py --protocol governance/delivery/cg28/protocol.json --preflight governance/delivery/cg28/preflight.json --cg27-protocol governance/delivery/cg27/protocol.json --cg27-closure governance/delivery/cg27/closure.json --governance-root governance --biz-root biz)
          expect_reject SOURCE_ISSUE_NOT_OPEN "${base[@]}" --issue-json /tmp/issue-closed.json
          expect_reject AUTHORITY_ESCALATION python3 governance/delivery/cg28/verify_execution.py --protocol /tmp/protocol-escalated.json --preflight governance/delivery/cg28/preflight.json --cg27-protocol governance/delivery/cg27/protocol.json --cg27-closure governance/delivery/cg27/closure.json --governance-root governance --biz-root biz --issue-json /tmp/issue.json
          expect_reject UNAUTHORIZED_EXECUTION_RECORDED python3 governance/delivery/cg28/verify_execution.py --protocol governance/delivery/cg28/protocol.json --preflight /tmp/preflight-fake-execution.json --cg27-protocol governance/delivery/cg27/protocol.json --cg27-closure governance/delivery/cg27/closure.json --governance-root governance --biz-root biz --issue-json /tmp/issue.json

      - name: Prove zero remote mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m json.tool governance/delivery/cg28/protocol.json >/dev/null
          python3 -m json.tool governance/delivery/cg28/preflight.json >/dev/null
          python3 -m py_compile governance/delivery/cg28/verify_execution.py
          rm -rf governance/delivery/cg28/__pycache__
          test -z "$(git -C governance status --porcelain)"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          test "$(git -C biz rev-parse HEAD^{tree})" = "$BIZ_TREE"
          test -z "$(git -C biz status --porcelain)"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          curl --fail --silent --show-error -H "$auth" -H "$accept" "${GITHUB_API_URL}/repos/hvritual/biz/issues/62" > /tmp/issue-final.json
          python3 - <<'PY'
          import json
          issue=json.load(open('/tmp/issue-final.json'))
          assert issue['state']=='open', issue['state']
          assert issue['comments']==0, issue['comments']
          print('CG28_REMOTE_MUTATION=NONE')
          PY
