name: CG-20 merge execution preparation qualification

on:
  push:
    branches:
      - cg20/controlled-merge-execution
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: qualify-merge-execution-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-19 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:prevention/cg19/protocol.json)" = "8fd1d6eadafe538f962b80c261949b3f8203428c"
          test "$(git rev-parse HEAD:prevention/cg19/cases.json)" = "1bc98fa38934c7c52ac58a7d1df562b1ece3a6bf"
          test "$(git rev-parse HEAD:prevention/cg19/authorize_merge.py)" = "0466aedf3c49818a14fbe96413c7345d7acedff7"
          test "$(git rev-parse HEAD:prevention/cg19/verify_authorization.py)" = "3437e5f301cf86b962bc2613879c6d20151522bc"
          python3 - <<'PY'
          import json
          assert json.load(open('prevention/cg19/protocol.json'))['status']=='QUALIFIED'
          PY
          echo 'CG20_CG19_SOURCE_AUTHORITIES=PASS'

      - name: Build exact authorization and merge execution request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_REPOSITORY: hvritual/engineering-governance
          QUALIFICATION_PR: '43'
          QUALIFICATION_BASE_BRANCH: cg20-qualification/base
          QUALIFICATION_BASE_SHA: 916b33608d6cc0dc2eb48549e82b072b114473a2
          QUALIFICATION_HEAD_BRANCH: cg20-qualification/head
          QUALIFICATION_HEAD_SHA: c47666a5cd695dd26773bef527129c35666153aa
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, copy, hashlib, importlib.util, json, os, subprocess, sys, tempfile
          from pathlib import Path

          for p in ['prevention/cg17','prevention/cg18','prevention/cg19','prevention/cg20']:
              sys.path.insert(0,str(Path(p).resolve()))

          def loadmod(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod

          v17=loadmod('v17','prevention/cg17/verify_provider_diff.py')
          q18=loadmod('q18','prevention/cg18/qualify_pull_request.py')
          a19=loadmod('a19','prevention/cg19/authorize_merge.py')
          p20m=loadmod('p20m','prevention/cg20/prepare_merge.py')
          p17=json.load(open('prevention/cg17/protocol.json'))
          p18=json.load(open('prevention/cg18/protocol.json'))
          p19=json.load(open('prevention/cg19/protocol.json'))
          p20=json.load(open('prevention/cg20/protocol.json'))
          c20=json.load(open('prevention/cg20/cases.json'))
          assert p20['status'] in ('CANDIDATE','QUALIFIED')

          for case in c20['realCurrentStateRefusals']:
              try: p20m.validate_source(p20,case['sourceMergeAuthorization'])
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason==case['expectedReason'],(case,exc.reason)
              else: raise AssertionError('real subject unexpectedly CG20-eligible')
          print('CG20_REAL_CURRENT_STATE_REFUSAL=PASS')

          token=os.environ['GITHUB_TOKEN']
          repository=os.environ['QUALIFICATION_REPOSITORY']
          pr_number=int(os.environ['QUALIFICATION_PR'])
          base_branch=os.environ['QUALIFICATION_BASE_BRANCH']
          base_sha=os.environ['QUALIFICATION_BASE_SHA']
          head_branch=os.environ['QUALIFICATION_HEAD_BRANCH']
          head_sha=os.environ['QUALIFICATION_HEAD_SHA']
          clean_url='https://github.com/'+repository+'.git'

          def git(repo,*args,check=True):
              cp=subprocess.run(['git','-C',str(repo),*args],capture_output=True,text=True)
              if check and cp.returncode: raise AssertionError((args,cp.stdout,cp.stderr))
              return cp
          def digest(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          def sha_text(value): return hashlib.sha256(value.encode()).hexdigest()
          def reauth(auth):
              core={k:v for k,v in auth.items() if k not in {'status','decision','authorizationId'}}
              auth['authorizationId']=digest(core)

          with tempfile.TemporaryDirectory() as root:
              repo=Path(root)/'repo'
              subprocess.run(['git','clone','-q','--no-hardlinks','.',str(repo)],check=True)
              git(repo,'remote','set-url','origin',clean_url)
              git(repo,'fetch','-q','origin',base_branch,head_branch)
              git(repo,'checkout','-q','-B',head_branch,head_sha)
              assert git(repo,'status','--porcelain','--untracked-files=all').stdout==''
              assert git(repo,'ls-remote','--refs','origin','refs/heads/'+base_branch).stdout.split()[0]==base_sha
              assert git(repo,'ls-remote','--refs','origin','refs/heads/'+head_branch).stdout.split()[0]==head_sha
              paths=sorted(x for x in git(repo,'diff','--name-only','-z',base_sha,head_sha,'--').stdout.split('\0') if x)
              assert paths==c20['qualificationFixture']['changedPaths'],paths
              diff_bytes=subprocess.check_output(['git','-C',str(repo),'diff','--binary','--full-index','--no-ext-diff',base_sha,head_sha,'--'])
              diff_sha=hashlib.sha256(diff_bytes).hexdigest()

              cg16_core={
                  'schemaVersion':1,'protocolId':'CG16-CONTROLLED-PULL-REQUEST-CREATION','caseId':'CG20-MERGE-EXECUTION-FIXTURE',
                  'repository':repository,'provider':'GITHUB','externalExecutor':'TRUSTED_GITHUB_CONNECTOR',
                  'sourceRemotePublicationAttestationId':sha_text('cg20-pub-id'),'sourceRemotePublicationAttestationSha256':sha_text('cg20-pub-sha'),
                  'pullRequestRequestId':sha_text('cg20-request-id'),'pullRequestRequestSha256':sha_text('cg20-request-sha'),
                  'externalExecutionReceiptSha256':sha_text('cg20-pr-create-receipt'),'pullRequestNumber':pr_number,
                  'pullRequestNodeId':'qualification-only','pullRequestUrl':'https://github.com/'+repository+'/pull/'+str(pr_number),
                  'baseBranch':base_branch,'baseSha':base_sha,'headBranch':head_branch,'headSha':head_sha,'changedPaths':paths,
                  'diffSha256':diff_sha,'verificationClasses':['FIXTURE_MERGE_EXECUTION_CHECK'],'title':'CG-20 qualification fixture',
                  'bodySha256':sha_text('qualificationOnly=true\nconsumerEvidence=false\nCG-20 controlled merge execution qualification only.'),
                  'pullRequestUpdateAuthorization':'NOT_GRANTED','reviewSubmissionAuthorization':'NOT_GRANTED','autoMergeAuthorization':'NOT_GRANTED',
                  'mergeAuthorization':'NOT_GRANTED','directMainUpdate':False,'repositoryAdministration':False,'consumerAdoption':False
              }
              cg16={**cg16_core,'status':'PULL_REQUEST_ATTESTED','decision':'CONTROLLED_PULL_REQUEST_CREATION_VERIFIED','pullRequestAttestationId':digest(cg16_core)}
              cg17=v17.verify(p17,cg16,repo,token)
              assert cg17['status']=='PROVIDER_DIFF_ATTESTED'
              cg18=q18.qualify(p18,cg17,token)
              assert cg18['status']=='PULL_REQUEST_QUALIFIED' and cg18['decision']=='PR_QUALIFIED_FOR_HUMAN_MERGE_REVIEW',cg18
              assert cg18['qualificationReasons']==[] and cg18['mergeAuthorization']=='NOT_GRANTED'

              human=c20['qualificationFixture']['humanDecision']
              dcore={
                  'schemaVersion':1,'decisionType':'HUMAN_MERGE_DECISION','decisionOrigin':human['decisionOrigin'],'action':human['action'],
                  'authorizer':human['authorizer'],'repository':repository,'pullRequestNumber':pr_number,'baseSha':base_sha,'headSha':head_sha,
                  'sourceQualificationAttestationId':cg18['qualificationAttestationId'],'mergeMethod':human['mergeMethod'],'nonce':human['nonce'],
                  'mergeAuthorizationRequested':'GRANTED_ONCE','autoMerge':False,'directMainUpdate':False
              }
              human_decision={**dcore,'decisionId':digest(dcore)}
              auth=a19.authorize(p19,p18,cg18,human_decision,token)
              assert auth['status']=='MERGE_AUTHORIZATION_ATTESTED' and auth['mergeAuthorization']=='GRANTED_ONCE'
              assert auth['authorizationUseLimit']==1 and auth['consumptionState']=='NOT_CONSUMED' and auth['executesMerge'] is False

              request=p20m.prepare(p20,auth,token)
              assert request['status']=='MERGE_EXECUTION_REQUEST_READY'
              assert request['expectedHeadSha']==head_sha and request['mergeMethod']=='squash'
              assert request['externalExecutor']=='TRUSTED_GITHUB_CONNECTOR'

              print('CG20_AUTHORIZATION_ID='+auth['authorizationId'])
              print('CG20_REQUEST_ID='+request['requestId'])
              print('CG20_EXPECTED_HEAD_SHA='+request['expectedHeadSha'])
              print('CG20_PREPARE=PASS')
              print('CG20_AUTHORIZATION_JSON_B64='+base64.b64encode(json.dumps(auth,sort_keys=True,separators=(',',':')).encode()).decode())
              print('CG20_REQUEST_JSON_B64='+base64.b64encode(json.dumps(request,sort_keys=True,separators=(',',':')).encode()).decode())

              bad=copy.deepcopy(auth); bad['authorizationId']='0'*64
              try: p20m.validate_source(p20,bad)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='CG19_AUTHORIZATION_ID_MISMATCH'
              else: raise AssertionError('tampered authorization accepted')

              bad=copy.deepcopy(auth); bad['consumptionState']='CONSUMED'; reauth(bad)
              try: p20m.validate_source(p20,bad)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='AUTHORIZATION_ALREADY_CONSUMED'
              else: raise AssertionError('consumed authorization accepted')

              bad=copy.deepcopy(auth); bad['authorizationUseLimit']=2; reauth(bad)
              try: p20m.validate_source(p20,bad)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='AUTHORIZATION_USE_LIMIT_INVALID'
              else: raise AssertionError('multi-use authorization accepted')

              bad=copy.deepcopy(auth); bad['executesMerge']=True; reauth(bad)
              try: p20m.validate_source(p20,bad)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='SOURCE_EXECUTION_AUTHORITY_INVALID'
              else: raise AssertionError('source execution escalation accepted')

              bad=copy.deepcopy(auth); bad['mergeMethod']='merge'; reauth(bad)
              try: p20m.validate_source(p20,bad)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='MERGE_METHOD_NOT_ALLOWED'
              else: raise AssertionError('wrong merge method accepted')

              bad=copy.deepcopy(auth); bad['headSha']='0'*40; bad['expectedHeadSha']='0'*40; reauth(bad)
              try: p20m.prepare(p20,bad,token)
              except p20m.MergeExecutionPreparationError as exc: assert exc.reason=='LIVE_HEAD_IDENTITY_MISMATCH',(exc.reason,exc.detail)
              else: raise AssertionError('live head drift accepted')

              print('CG20_NEGATIVE_MATRIX=PASS')
              print('CG20_CONSUMER_MUTATION=NONE')
              print('CG20_MAIN_MUTATION=NONE')
          PY

      - name: Stable asset syntax and governance cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool prevention/cg20/protocol.json >/dev/null
          python3 -m json.tool prevention/cg20/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ['prevention/cg20/prepare_merge.py','prevention/cg20/verify_merge.py']:
              ast.parse(Path(p).read_text(),filename=p)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG20_STABLE_ASSETS=PASS'
