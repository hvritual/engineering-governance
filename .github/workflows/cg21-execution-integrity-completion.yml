name: CG-21 execution integrity completion qualification

on:
  push:
    branches:
      - cg21/execution-integrity-completion
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: qualify-execution-integrity-completion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-20 and CG-07 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:prevention/cg20/protocol.json)" = "8448a06824577f552da072dee81b02bf7674fcc1"
          test "$(git rev-parse HEAD:prevention/cg20/cases.json)" = "b4021d6bd3698ba19c22e0a7377e559c311dff3b"
          test "$(git rev-parse HEAD:prevention/cg20/prepare_merge.py)" = "a19655e617e0e30af73602ef480442e507945ca3"
          test "$(git rev-parse HEAD:prevention/cg20/verify_merge.py)" = "7bbebb0a539afcb443644d44832d5424137fc0c8"
          test "$(git rev-parse HEAD:delivery/cg07/protocol.json)" = "df9c02be24cb1bc5f7ad8681520e25718c9ec978"
          test "$(git rev-parse HEAD:delivery/cg07/verify_post_merge.py)" = "86145656bf426b1dd6e40c8e8614c729b6979616"
          python3 - <<'PY'
          import json
          assert json.load(open('prevention/cg20/protocol.json'))['status']=='QUALIFIED'
          assert json.load(open('delivery/cg07/protocol.json'))['status']=='QUALIFIED'
          print('CG21_SOURCE_AUTHORITIES=PASS')
          PY

      - name: Qualify execution to integrity completion convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, importlib.util, json, sys
          from pathlib import Path

          root=Path('.').resolve()
          sys.path.insert(0,str(root/'delivery/cg21'))
          import reconcile_completion as r21
          import verify_completion as v21

          protocol=json.load(open('delivery/cg21/protocol.json'))
          cases=json.load(open('delivery/cg21/cases.json'))
          cg07=json.load(open('delivery/cg07/protocol.json'))
          cg07_protocol_path=str(root/'delivery/cg07/protocol.json')
          cg07_verifier_path=str(root/'delivery/cg07/verify_post_merge.py')
          assert protocol['status'] in ('CANDIDATE','QUALIFIED')

          for case in cases['realCurrentStateRefusals']:
              try:
                  r21.validate_source(protocol,case['sourceExecutionAttestation'])
              except r21.CompletionReconciliationError as exc:
                  assert exc.reason==case['expectedReason'],(case,exc.reason)
              else:
                  raise AssertionError('real subject unexpectedly CG21-eligible')
          print('CG21_REAL_CURRENT_STATE_REFUSAL=PASS')

          fixture=cases['qualificationFixture']
          core=copy.deepcopy(fixture['sourceCore'])
          source={**core,'status':'MERGE_EXECUTION_ATTESTED','decision':'CONTROLLED_MERGE_EXECUTION_VERIFIED','executionAttestationId':r21.canonical_digest(core)}
          observed=copy.deepcopy(fixture['observed'])

          completion=r21.reconcile(protocol,cg07,cg07_protocol_path,cg07_verifier_path,source,observed)
          assert completion['status']=='DELIVERY_COMPLETION_ATTESTED'
          assert completion['decision']=='EXECUTION_INTEGRITY_COMPLETION_VERIFIED'
          assert completion['completionState']==fixture['expectedCompletionState']
          assert completion['recoveryDisposition']==fixture['expectedRecoveryDisposition']
          assert completion['integrityAuthority']=='CG07'
          assert completion['repositoryBlocking'] is False
          receipt=v21.verify(protocol,cg07,cg07_protocol_path,cg07_verifier_path,source,observed,completion)
          assert receipt['status']=='DELIVERY_COMPLETION_ATTESTATION_VERIFIED'
          print('CG21_EXECUTION_ATTESTATION_ID='+source['executionAttestationId'])
          print('CG21_COMPLETION_ATTESTATION_ID='+completion['completionAttestationId'])
          print('CG21_COMPLETION_VERIFICATION_ID='+receipt['verificationId'])
          print('CG21_COMPLETION_STATE='+completion['completionState'])
          print('CG21_RECOVERY_DISPOSITION='+completion['recoveryDisposition'])
          print('CG21_POSITIVE=PASS')

          def reattest(value):
              core={k:v for k,v in value.items() if k not in {'status','decision','executionAttestationId'}}
              value['executionAttestationId']=r21.canonical_digest(core)
          def recompletion(value):
              core={k:v for k,v in value.items() if k not in {'status','decision','completionAttestationId'}}
              value['completionAttestationId']=r21.canonical_digest(core)
          def expect_source_reason(value,reason):
              try:r21.validate_source(protocol,value)
              except r21.CompletionReconciliationError as exc:assert exc.reason==reason,(reason,exc.reason)
              else:raise AssertionError('source negative accepted: '+reason)
          def expect_reconcile_cg07_reason(obs,cg07_reason):
              try:r21.reconcile(protocol,cg07,cg07_protocol_path,cg07_verifier_path,source,obs)
              except r21.CompletionReconciliationError as exc:
                  assert exc.reason=='CG07_POST_MERGE_INTEGRITY_NOT_PROVEN',exc.reason
                  detail=exc.detail or {}; nested=detail.get('cg07') or {}
                  assert nested.get('reason')==cg07_reason,(cg07_reason,nested)
              else:raise AssertionError('CG07 negative accepted: '+cg07_reason)

          bad=copy.deepcopy(source); bad['executionAttestationId']='0'*64
          expect_source_reason(bad,'CG20_EXECUTION_ATTESTATION_ID_MISMATCH')
          bad=copy.deepcopy(source); bad['baseBranch']='develop'; reattest(bad)
          expect_source_reason(bad,'CG07_REQUIRED_BASE_BRANCH_MISMATCH')
          bad=copy.deepcopy(source); bad['consumptionState']='NOT_CONSUMED'; reattest(bad)
          expect_source_reason(bad,'AUTHORIZATION_CONSUMPTION_STATE_INVALID')
          bad=copy.deepcopy(source); bad['authorizationUseCount']=2; reattest(bad)
          expect_source_reason(bad,'AUTHORIZATION_USE_COUNT_INVALID')

          badobs=copy.deepcopy(observed); badobs['pullRequestPaths']=['src/other.txt']
          expect_reconcile_cg07_reason(badobs,'REVIEWED_PATH_SET_MISMATCH')
          badobs=copy.deepcopy(observed); badobs['postMergeCommit']['parents']=['5555555555555555555555555555555555555555']
          expect_reconcile_cg07_reason(badobs,'SQUASH_PARENT_MISMATCH')
          badobs=copy.deepcopy(observed); badobs['currentMain']={'sha':'5555555555555555555555555555555555555555','relationFromQualifiedMerge':'diverged','containsQualifiedMerge':False}
          expect_reconcile_cg07_reason(badobs,'CURRENT_MAIN_DOES_NOT_CONTAIN_QUALIFIED_MERGE')

          badc=copy.deepcopy(completion); badc['executesRecovery']=True; recompletion(badc)
          try:v21.verify(protocol,cg07,cg07_protocol_path,cg07_verifier_path,source,observed,badc)
          except v21.CompletionVerificationError as exc:assert exc.reason=='COMPLETION_AUTHORITY_ESCALATION',exc.reason
          else:raise AssertionError('completion authority escalation accepted')
          badc=copy.deepcopy(completion); badc['integrityAuthority']='CG21'; recompletion(badc)
          try:v21.verify(protocol,cg07,cg07_protocol_path,cg07_verifier_path,source,observed,badc)
          except v21.CompletionVerificationError as exc:assert exc.reason=='INTEGRITY_AUTHORITY_DRIFT',exc.reason
          else:raise AssertionError('integrity authority drift accepted')

          print('CG21_NEGATIVE_MATRIX=PASS')
          print('CG21_CONSUMER_MUTATION=NONE')
          print('CG21_MAIN_MUTATION=NONE')
          PY

      - name: Stable asset syntax and branch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool delivery/cg21/protocol.json >/dev/null
          python3 -m json.tool delivery/cg21/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ['delivery/cg21/reconcile_completion.py','delivery/cg21/verify_completion.py']:
              ast.parse(Path(p).read_text(),filename=p)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG21_STABLE_ASSETS=PASS'
