name: CG-25 Biz authorization readiness qualification

on:
  push:
    branches:
      - cg25/biz-authorization-readiness

permissions:
  contents: read

jobs:
  qualify-authorization-readiness:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify governance task ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD a72515c8ff853dadfd83ded3fb22fba0864112b9)" = "a72515c8ff853dadfd83ded3fb22fba0864112b9"
          test "$(git rev-parse a72515c8ff853dadfd83ded3fb22fba0864112b9^{tree})" = "83779b9da1d069f2039a45bf48ede6dd84719ebc"
          echo 'CG25_GOVERNANCE_BASE=PASS'

      - name: Checkout exact live Biz consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/biz
          ref: 1f6443f51b767e95124b2256474fb288ff6a5726
          path: _consumer/biz
          fetch-depth: 1
          persist-credentials: false

      - name: Read live source issue and historical qualification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/hvritual/biz/issues/62 > /tmp/biz-issue-62.json
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/hvritual/biz/actions/runs/34709795289 > /tmp/biz-catalog-run.json
          python3 - <<'PY'
          import json
          issue=json.load(open('/tmp/biz-issue-62.json'))
          run=json.load(open('/tmp/biz-catalog-run.json'))
          assert issue['number']==62 and issue['state']=='open'
          assert run['id']==34709795289
          assert run['name']=='CE-13 plan catalog qualification'
          assert run['head_sha']=='c420628fce2e3dad982ad7ee3139f2afa16102af'
          assert run['status']=='completed' and run['conclusion']=='success'
          print('CG25_LIVE_PROVENANCE=PASS')
          PY

      - name: Qualify fail-closed authorization readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 delivery/cg25/verify_readiness.py \
            --protocol delivery/cg25/protocol.json \
            --case delivery/cg25/case.json \
            --cg24-protocol delivery/cg24/protocol.json \
            --cg24-plan delivery/cg24/plan.json \
            --governance-root . \
            --biz-root _consumer/biz \
            --issue-json /tmp/biz-issue-62.json \
            --historical-run-json /tmp/biz-catalog-run.json | tee /tmp/cg25-receipt.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/cg25-receipt.json'))
          assert r['status']=='AUTHORIZATION_READINESS_QUALIFIED'
          assert r['decision']=='AUTHORIZATION_NOT_GRANTED'
          assert r['disposition']=='LIVE_RECONCILIATION_REQUIRED'
          assert r['readinessId']=='7127b2117db8b5bd33b9de0a9fec80f5747ef3233fb7ded0b1fd6574eda89a87'
          assert r['plannedBaseSha']=='bd4a155b6fc27b3a0c2b2ee03a40bdb1ba59e2c9'
          assert r['liveBaseSha']=='1f6443f51b767e95124b2256474fb288ff6a5726'
          assert r['plannedOperationId']=='commercial.plan.catalog'
          assert r['liveOperationId']=='commercial.plan.discover'
          assert r['plannedUseCase']=='list_plan_catalog'
          assert r['liveUseCase']=='list_plans'
          assert r['authorizationGranted'] is False
          assert r['consumerMutation'] is False
          assert r['semanticEquivalenceDecided'] is False
          print('CG25_POSITIVE=PASS')
          PY

      - name: Fail-closed matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, importlib.util, json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('cg25v', Path('delivery/cg25/verify_readiness.py'))
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          protocol=json.load(open('delivery/cg25/protocol.json'))
          case=json.load(open('delivery/cg25/case.json'))
          cg24p=json.load(open('delivery/cg24/protocol.json'))
          cg24plan=json.load(open('delivery/cg24/plan.json'))
          issue=json.load(open('/tmp/biz-issue-62.json'))
          run=json.load(open('/tmp/biz-catalog-run.json'))
          gov=Path('.')
          biz=Path('_consumer/biz')

          def recase(value):
              value['readinessId']=v.digest(v.case_core(value))
          def expect(pr, ca, reason):
              try:
                  v.verify(pr, ca, cg24p, cg24plan, gov, biz, issue, run)
              except v.ReadinessError as exc:
                  assert exc.reason==reason,(reason,exc.reason)
              else:
                  raise AssertionError('negative accepted: '+reason)

          bad=copy.deepcopy(protocol); bad['liveConsumer']['sha']='0'*40
          expect(bad, case, 'LIVE_CONSUMER_SHA_MISMATCH')

          bad=copy.deepcopy(protocol); bad['liveConsumer']['authorities'][0]['blob']='0'*40
          expect(bad, case, 'LIVE_AUTHORITY_BLOB_MISMATCH')

          bad=copy.deepcopy(protocol); bad['historicalEvidence']['semanticEquivalenceClaimed']=True
          expect(bad, case, 'HISTORICAL_EVIDENCE_OVERCLAIM')

          badcase=copy.deepcopy(case); badcase['observations']['consumerBaseMoved']=False; recase(badcase)
          expect(protocol, badcase, 'BASE_MOVED_OBSERVATION_REQUIRED')

          badcase=copy.deepcopy(case); badcase['observations']['semanticEquivalenceDecided']=True; recase(badcase)
          expect(protocol, badcase, 'SEMANTIC_EQUIVALENCE_MUST_REMAIN_UNDECIDED')

          badcase=copy.deepcopy(case); badcase['decision']='PATCH_BRANCH_ONLY'; recase(badcase)
          expect(protocol, badcase, 'READINESS_DECISION_INVALID')

          badcase=copy.deepcopy(case); badcase['reasons']=badcase['reasons'][:-1]; recase(badcase)
          expect(protocol, badcase, 'READINESS_REASON_SET_MISMATCH')

          badcase=copy.deepcopy(case); badcase['authority']['authorizesPatch']=True; recase(badcase)
          expect(protocol, badcase, 'AUTHORIZATION_ESCALATION')

          badcase=copy.deepcopy(case); badcase['sourcePlan']['planId']='0'*64; recase(badcase)
          expect(protocol, badcase, 'CASE_SOURCE_PLAN_ID_MISMATCH')

          print('CG25_NEGATIVE_MATRIX=PASS')
          PY

      - name: Stable asset syntax and zero consumer mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool delivery/cg25/protocol.json >/dev/null
          python3 -m json.tool delivery/cg25/case.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('delivery/cg25/verify_readiness.py').read_text(), filename='delivery/cg25/verify_readiness.py')
          PY
          test "$(git -C _consumer/biz rev-parse HEAD)" = "1f6443f51b767e95124b2256474fb288ff6a5726"
          test "$(git -C _consumer/biz rev-parse HEAD^{tree})" = "a98817ce0075ede4a13715307ad3ebf9830f8bf1"
          test -z "$(git -C _consumer/biz status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG25_CONSUMER_MUTATION=NONE'
          echo 'CG25_GOVERNANCE_TRACKED_MUTATION=NONE'
