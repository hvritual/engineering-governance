name: CG-23 real Biz consumer qualification

on:
  push:
    branches:
      - cg23/biz-plan-catalog-consumer

permissions:
  contents: read

jobs:
  qualify-real-biz-consumer:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Biz consumer baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/biz
          ref: bd4a155b6fc27b3a0c2b2ee03a40bdb1ba59e2c9
          path: _consumer/biz
          fetch-depth: 1
          persist-credentials: false

      - name: Read live source issue
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/hvritual/biz/issues/62 \
            > /tmp/biz-issue-62.json
          python3 - <<'PY'
          import json
          issue=json.load(open('/tmp/biz-issue-62.json'))
          assert issue['number']==62
          assert issue['state']=='open'
          print('CG23_BIZ_ISSUE_62_OPEN=PASS')
          PY

      - name: Qualify current real consumer
        run: |
          set -euo pipefail
          python3 corpus/cg23/biz-plan-catalog/qualify.py \
            --case corpus/cg23/biz-plan-catalog/case.json \
            --biz-root _consumer/biz \
            --issue-json /tmp/biz-issue-62.json \
            | tee /tmp/cg23-receipt.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/cg23-receipt.json'))
          assert r['status']=='REAL_CONSUMER_PROBLEM_QUALIFIED'
          assert r['decision']=='CURRENT_BIZ_CONSUMER_REQUIRES_CONTROLLED_PLAN'
          assert r['consumerBaseSha']=='bd4a155b6fc27b3a0c2b2ee03a40bdb1ba59e2c9'
          assert r['issue']==62 and r['issueState']=='open'
          assert r['existingVersionListOperation']=='commercial.plan.list'
          assert r['missingHttpMethod']=='GET'
          assert r['missingHttpPath']=='/v1/platform/plans'
          assert r['frameworkDefectClaimed'] is False
          assert r['consumerPatchAuthorized'] is False
          assert r['consumerBranchCreationAuthorized'] is False
          assert r['consumerPullRequestAuthorized'] is False
          assert r['consumerMutation'] is False
          assert r['nextDisposition']=='CONTROLLED_PLAN_REQUIRED'
          print('CG23_REAL_CONSUMER_POSITIVE=PASS')
          PY

      - name: Fail-closed matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, importlib.util, json
          from pathlib import Path

          p=Path('corpus/cg23/biz-plan-catalog/qualify.py')
          spec=importlib.util.spec_from_file_location('cg23q',p)
          q=importlib.util.module_from_spec(spec); spec.loader.exec_module(q)
          case=json.load(open('corpus/cg23/biz-plan-catalog/case.json'))
          issue=json.load(open('/tmp/biz-issue-62.json'))
          root=Path('_consumer/biz')

          def expect(c,i,reason):
              try: q.qualify(c,root,i)
              except q.QualificationError as exc: assert exc.reason==reason,(reason,exc.reason)
              else: raise AssertionError('negative accepted: '+reason)

          bad=copy.deepcopy(case); bad['consumerBaseline']['commit']='0'*40
          expect(bad,issue,'CONSUMER_BASE_SHA_MISMATCH')

          bad_issue=copy.deepcopy(issue); bad_issue['state']='closed'
          expect(case,bad_issue,'SOURCE_ISSUE_NOT_OPEN')

          bad_issue=copy.deepcopy(issue); bad_issue['number']=999
          expect(case,bad_issue,'SOURCE_ISSUE_NUMBER_MISMATCH')

          bad=copy.deepcopy(case); bad['authoritativeFiles']['planContract']['gitBlobSha']='0'*40
          expect(bad,issue,'AUTHORITATIVE_FILE_BLOB_MISMATCH')

          print('CG23_NEGATIVE_MATRIX=PASS')
          PY

      - name: Stable asset syntax and no consumer mutation
        run: |
          set -euo pipefail
          python3 -m json.tool corpus/cg23/biz-plan-catalog/case.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('corpus/cg23/biz-plan-catalog/qualify.py').read_text())
          PY
          test "$(git -C _consumer/biz rev-parse HEAD)" = "bd4a155b6fc27b3a0c2b2ee03a40bdb1ba59e2c9"
          test -z "$(git -C _consumer/biz status --porcelain)"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG23_CONSUMER_MUTATION=NONE'
          echo 'CG23_GOVERNANCE_TRACKED_MUTATION=NONE'
