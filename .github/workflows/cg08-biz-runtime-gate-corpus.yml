name: CG-08 Biz runtime gate corpus qualification

on:
  push:
    branches:
      - cg08/biz-runtime-gate-corpus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-second-real-problem
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUGGY_SHA: a72119b7bd00e32abb840f3c93ed486fc8b004dd
      FIXED_SHA: 51355872d1e6af2961826a053df6d0ad7008ff73
    steps:
      - name: Checkout governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact historical buggy Biz source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/biz
          ref: ${{ env.BUGGY_SHA }}
          path: buggy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact fixed Biz source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/biz
          ref: ${{ env.FIXED_SHA }}
          path: fixed
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C buggy rev-parse HEAD)" = "$BUGGY_SHA"
          test "$(git -C fixed rev-parse HEAD)" = "$FIXED_SHA"

          test "$(git -C buggy rev-parse HEAD:.github/workflows/b12-7-runtime-qualification.yml)" = "b04644dc5d674e4bb02ad35da2b6ffe3ac00ccb6"
          test "$(git -C fixed rev-parse HEAD:.github/workflows/b12-7-runtime-qualification.yml)" = "dc3520b5962fc312063a34e0b016a86882e15e08"
          test "$(git -C fixed rev-parse HEAD:scripts/ce04_runtime_closure.py)" = "2b75316b4341e8abc8c7e8ba067d7404a88f365d"
          test "$(git -C fixed rev-parse HEAD:scripts/test_ce04_runtime_closure.py)" = "f2b7d4ce12683bb63372d4976a882c0723379cd0"
          test "$(git -C fixed rev-parse HEAD:contracts/generated/manifest.json)" = "998079e346be285d84b6d6421a453afd2f56b5c4"
          test "$(git -C fixed rev-parse HEAD:.yunka/dev.json)" = "48cda1687594a97d1abf52412d9273aaee58dd20"

          echo 'CG08_SOURCE_HASHES_BEGIN'
          sha256sum \
            buggy/.github/workflows/b12-7-runtime-qualification.yml \
            fixed/.github/workflows/b12-7-runtime-qualification.yml \
            fixed/scripts/ce04_runtime_closure.py \
            fixed/scripts/test_ce04_runtime_closure.py \
            fixed/contracts/generated/manifest.json \
            fixed/.yunka/dev.json
          echo 'CG08_SOURCE_HASHES_END'

      - name: Prove exact historical duplicated-topology shape
        shell: bash
        run: |
          set -euo pipefail
          workflow=buggy/.github/workflows/b12-7-runtime-qualification.yml
          grep -Fq '"application:access/tenant_lifecycle"' "$workflow"
          grep -Fq '"application:access/tenant_member_lifecycle"' "$workflow"
          grep -Fq '"application:access/tenant_role_permission"' "$workflow"
          grep -Fq '"application:deviceops/device_management"' "$workflow"
          grep -Fq '"application:deviceops/device_transfer"' "$workflow"
          grep -Fq '"application:deviceops/site_management"' "$workflow"
          grep -Fq "| length == 6' .yunka/runtime-graph.json" "$workflow"
          if grep -Fq 'application:commercial/module_catalog' "$workflow"; then
            echo 'buggy gate unexpectedly contains the later commercial application' >&2
            exit 1
          fi
          if grep -Fq 'application:commercial/entitlement_management' "$workflow"; then
            echo 'buggy gate unexpectedly contains the later entitlement application' >&2
            exit 1
          fi
          echo 'CG08_BUG_SHAPE=PROVEN'

      - name: Replay stale fixed-six gate against authoritative valid topology
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=fixed/scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from test_ce04_runtime_closure import fixture

          data = fixture()
          manifest = data['manifest']
          config = data['config']
          expected = sorted(
              'application:' + s['domain'] + '/' + s['application']['name']
              for s in manifest['services'] if s.get('application')
          )
          configured = sorted(config['processes'][0]['graphNodes'])
          legacy = sorted([
              'application:access/tenant_lifecycle',
              'application:access/tenant_member_lifecycle',
              'application:access/tenant_role_permission',
              'application:deviceops/device_management',
              'application:deviceops/device_transfer',
              'application:deviceops/site_management',
          ])
          assert expected == configured, (expected, configured)
          assert len(expected) == 8, expected
          assert len(legacy) == 6
          assert set(legacy) < set(expected), (legacy, expected)
          assert 'application:commercial/module_catalog' in expected
          assert 'application:commercial/entitlement_management' in expected

          observed_nodes = sorted(data['status']['processes'][0]['graphNodes'])
          runs = [e for e in data['graph']['edges'] if e['kind'] == 'runs' and e['from'] == 'process:biz']
          legacy_status_accepts = observed_nodes == legacy
          legacy_runs_accepts = len(runs) == 6 and sorted(e['to'] for e in runs) == legacy
          assert not legacy_status_accepts
          assert not legacy_runs_accepts

          print('CG08_AUTHORITATIVE_APPLICATIONS=' + json.dumps(expected))
          print('CG08_AUTHORITATIVE_APPLICATION_COUNT=8')
          print('CG08_LEGACY_APPLICATION_COUNT=6')
          print('CG08_LEGACY_STATUS_PREDICATE=REJECTS_VALID_EXPANSION')
          print('CG08_LEGACY_RUNS_PREDICATE=REJECTS_VALID_EXPANSION')
          PY

      - name: Qualify corrected authoritative checker and negative matrix
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=fixed/scripts python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('fixed/scripts', pattern='test_ce04_runtime_closure.py')
          count = suite.countTestCases()
          print(f'CG08_FIXED_CHECKER_TEST_COUNT={count}')
          if count != 25:
              raise SystemExit(f'expected exactly 25 existing checker tests, got {count}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit('fixed checker suite failed')
          print('CG08_FIXED_CHECKER_MATRIX=PASS')
          PY

      - name: Prove fixed workflow consumes authoritative checker rather than a replacement count
        shell: bash
        run: |
          set -euo pipefail
          workflow=fixed/.github/workflows/b12-7-runtime-qualification.yml
          grep -Fq 'python3 scripts/ce04_runtime_closure.py' "$workflow"
          grep -Fq -- '--manifest contracts/generated/manifest.json' "$workflow"
          grep -Fq -- '--config .yunka/dev.json' "$workflow"
          if grep -Fq "| length == 6' .yunka/runtime-graph.json" "$workflow"; then
            echo 'fixed workflow still carries historical fixed-six runs predicate' >&2
            exit 1
          fi
          echo 'CG08_FIXED_GATE_AUTHORITY=GENERATED_MANIFEST'

      - name: Verify corpus candidate and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool corpus/cg08/biz-runtime-gate/case.json >/dev/null
          test "$(git -C buggy status --porcelain)" = ''
          test "$(git -C fixed status --porcelain)" = ''
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'CG08_CONSUMER_MUTATION=NONE'
