name: CG-15 controlled remote branch publication qualification

on:
  push:
    branches:
      - cg15/controlled-remote-branch-publication
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: qualify-controlled-remote-publication-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-14 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:prevention/cg14/protocol.json)" = "6e281f535cd7138f37454e3e0aaa28e7fa504588"
          test "$(git rev-parse HEAD:prevention/cg14/cases.json)" = "0383a5b6756aad1e5982a3278adf291df6748387"
          test "$(git rev-parse HEAD:prevention/cg14/package_commit.py)" = "b6862708208da1fa8aa198869b9d7b90d8391c55"
          test "$(git rev-parse HEAD:prevention/cg14/verify_commit.py)" = "4b40832d510e233e17af22bb01ce58b7d33f7c87"
          python3 - <<'PY'
          import json
          assert json.load(open('prevention/cg14/protocol.json'))['status']=='QUALIFIED'
          PY
          echo 'CG15_CG14_SOURCE_AUTHORITIES=PASS'

      - name: Qualify real refusal and isolated remote publication lanes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, subprocess, tempfile
          from pathlib import Path

          def loadmod(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod

          e13=loadmod('e13','prevention/cg13/execute_patch.py')
          v13=loadmod('v13','prevention/cg13/verify_execution.py')
          p14m=loadmod('p14m','prevention/cg14/package_commit.py')
          v14=loadmod('v14','prevention/cg14/verify_commit.py')
          p15m=loadmod('p15m','prevention/cg15/publish_branch.py')
          v15=loadmod('v15','prevention/cg15/verify_publication.py')
          p13=json.load(open('prevention/cg13/protocol.json'))
          p14=json.load(open('prevention/cg14/protocol.json'))
          c14=json.load(open('prevention/cg14/cases.json'))
          p15=json.load(open('prevention/cg15/protocol.json'))
          c15=json.load(open('prevention/cg15/cases.json'))
          assert p15['status'] in ('CANDIDATE','QUALIFIED')
          assert c15['qualificationFixture']['qualificationOnly'] is True
          assert c15['qualificationFixture']['consumerEvidence'] is False

          current={x['caseId']:x['currentDisposition'] for x in c14['realCurrentStateRefusals']}
          for case in c15['realCurrentStateRefusals']:
              assert current[case['caseId']]==case['currentDisposition']
              try: p15m.validate_source_attestation(p15,case['sourceCommitAttestation'])
              except p15m.PublicationError as exc: assert exc.reason==case['expectedReason'], (case,exc.reason)
              else: raise AssertionError('real current-state case unexpectedly publish-eligible')
          print('CG15_REAL_CURRENT_STATE_REFUSAL=PASS')

          def git(repo,*args,check=True):
              cp=subprocess.run(['git','-C',str(repo),*args],capture_output=True,text=True)
              if check and cp.returncode: raise AssertionError((args,cp.stdout,cp.stderr))
              return cp

          def bare(remote,*args,check=True):
              cp=subprocess.run(['git','--git-dir',str(remote),*args],capture_output=True,text=True)
              if check and cp.returncode: raise AssertionError((args,cp.stdout,cp.stderr))
              return cp

          def init(root):
              f=c15['qualificationFixture']
              root=Path(root); repo=root/'repo'; remote=root/'remote.git'
              repo.mkdir(); subprocess.run(['git','init','--bare','-q',str(remote)],check=True)
              git(repo,'init','-q','-b',f['baseBranch']); git(repo,'config','user.email','cg15@example.invalid'); git(repo,'config','user.name','CG15 Qualification'); git(repo,'config','commit.gpgsign','false')
              for rel,content in f['initialFiles'].items():
                  p=repo/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content)
              git(repo,'add','.'); git(repo,'commit','-qm','base'); base=git(repo,'rev-parse','HEAD').stdout.strip()
              git(repo,'remote','add','origin',str(remote)); git(repo,'push','-q','origin',f'{base}:refs/heads/{f["baseBranch"]}')
              repository=e13.normalize_remote(str(remote))
              git(repo,'switch','-qc',f['workBranch'])
              for rel,content in f['patchedFiles'].items(): (repo/rel).write_text(content)
              patch=root/'patch.diff'; patch.write_bytes(subprocess.check_output(['git','-C',str(repo),'diff'])); git(repo,'checkout','--','.')
              r={'caseId':'CG15-ISOLATED-REMOTE-PUBLICATION-FIXTURE','authorizationStatus':'AUTHORIZED','repository':repository,'baseSha':base,'workBranch':f['workBranch'],'allowedPaths':f['allowedPaths'],'preservedVerificationClasses':f['verificationClasses'],'disposition':'PATCH_REQUIRED_ON_AUTHORIZED_BRANCH_ONLY','patchRequired':True,'consumerMutation':False,'directMainUpdate':False,'mergeAuthorization':False,'repositoryAdministration':False,'consumerAdoption':False}
              ex=e13.execute(p13,r,repo,patch)
              vr={'schemaVersion':1,'caseId':r['caseId'],'repository':repository,'baseSha':base,'workBranch':f['workBranch'],'changedPaths':ex['changedPaths'],'diffSha256':ex['diffSha256'],'checks':[{'class':'FIXTURE_BEHAVIOR_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg15-behavior').hexdigest()},{'class':'FIXTURE_STATIC_CHECK','outcome':'PASS','evidenceSha256':hashlib.sha256(b'cg15-static').hexdigest()}]}
              patch_att=v13.verify(p13,r,ex,vr,repo)
              commit_receipt=p14m.package_commit(p14,patch_att,repo,f['commitMessage'])
              commit_att=v14.verify(p14,patch_att,commit_receipt,repo)
              assert commit_att['status']=='LOCAL_COMMIT_ATTESTED'
              return repo,remote,commit_att

          with tempfile.TemporaryDirectory() as root:
              repo,remote,att=init(root)
              receipt=p15m.publish(p15,att,repo)
              out=v15.verify(p15,att,receipt,repo)
              assert out['status']=='REMOTE_BRANCH_PUBLICATION_ATTESTED' and out['decision']=='CONTROLLED_REMOTE_BRANCH_PUBLICATION_VERIFIED'
              assert out['remoteBranchSha']==att['commitSha']
              print('CG15_FIXTURE_PUBLICATION_ATTESTATION_ID='+out['publicationAttestationId'])
              print('CG15_ISOLATED_REMOTE_PUBLICATION=PASS')

          def reattest(att):
              core={k:v for k,v in att.items() if k not in {'status','decision','commitAttestationId'}}
              att['commitAttestationId']=p15m.canonical_digest(core)

          def expect_publish(reason,mutate=None,prepare=None):
              with tempfile.TemporaryDirectory() as root:
                  repo,remote,att=init(root)
                  if mutate: mutate(att)
                  if prepare: prepare(repo,remote,att)
                  try: p15m.publish(p15,att,repo)
                  except p15m.PublicationError as exc: assert exc.reason==reason,(reason,exc.reason,exc.detail); return
                  raise AssertionError('expected publication rejection '+reason)

          expect_publish('CG14_COMMIT_ATTESTATION_ID_MISMATCH',lambda a:a.__setitem__('commitAttestationId','0'*64))
          def grant_push(a): a['pushAuthorization']='GRANTED'; reattest(a)
          expect_publish('CG14_SOURCE_AUTHORITY_INVALID',grant_push)
          def wrong_origin(repo,remote,a):
              other=remote.parent/'other.git'; subprocess.run(['git','init','--bare','-q',str(other)],check=True); git(repo,'remote','set-url','origin',str(other))
          expect_publish('REPOSITORY_IDENTITY_MISMATCH',prepare=wrong_origin)
          expect_publish('WORK_BRANCH_MISMATCH',prepare=lambda repo,remote,a:git(repo,'switch','-q','main'))
          expect_publish('LOCAL_HEAD_COMMIT_MISMATCH',prepare=lambda repo,remote,a:git(repo,'commit','--allow-empty','-qm','unexpected local commit'))
          expect_publish('LOCAL_WORKTREE_NOT_CLEAN',prepare=lambda repo,remote,a:(repo/'src/other.txt').write_text('dirty\n'))
          expect_publish('REMOTE_BASE_BRANCH_MISSING',prepare=lambda repo,remote,a:bare(remote,'update-ref','-d','refs/heads/main'))
          expect_publish('REMOTE_BASE_SHA_MISMATCH',prepare=lambda repo,remote,a:git(repo,'push','-q','origin',f'{a["commitSha"]}:refs/heads/main'))
          expect_publish('REMOTE_TARGET_BRANCH_ALREADY_EXISTS',prepare=lambda repo,remote,a:git(repo,'push','-q','origin',f'{a["baseSha"]}:refs/heads/{a["workBranch"]}'))
          def main_branch(a): a['workBranch']='main'; reattest(a)
          expect_publish('WORK_BRANCH_MUST_NOT_BE_BASE_BRANCH',main_branch)

          def expect_verify(reason,mutate_receipt=None,mutate_repo=None,mutate_remote=None):
              with tempfile.TemporaryDirectory() as root:
                  repo,remote,att=init(root); receipt=p15m.publish(p15,att,repo)
                  if mutate_receipt: mutate_receipt(receipt)
                  if mutate_repo: mutate_repo(repo,receipt,att)
                  if mutate_remote: mutate_remote(repo,remote,receipt,att)
                  try: v15.verify(p15,att,receipt,repo)
                  except v15.PublicationAttestationError as exc: assert exc.reason==reason,(reason,exc.reason,exc.detail); return
                  raise AssertionError('expected publication verification rejection '+reason)

          expect_verify('SOURCE_COMMIT_ATTESTATION_DIGEST_MISMATCH',lambda r:r.__setitem__('sourceCommitAttestationSha256','0'*64))
          expect_verify('PULL_REQUEST_AUTHORIZATION_FORBIDDEN',lambda r:r.__setitem__('pullRequestAuthorization','GRANTED'))
          expect_verify('MERGE_AUTHORIZATION_FORBIDDEN',lambda r:r.__setitem__('mergeAuthorization','GRANTED'))
          expect_verify('ATOMIC_PUBLICATION_REQUIRED',lambda r:r.__setitem__('atomicPush',False))
          expect_verify('UNCONDITIONAL_FORCE_PUSH_FORBIDDEN',lambda r:r.__setitem__('unconditionalForcePush',True))
          expect_verify('REMOTE_TARGET_SHA_MISMATCH',mutate_remote=lambda repo,remote,r,a:bare(remote,'update-ref',f'refs/heads/{a["workBranch"]}',a['baseSha'],a['commitSha']))
          expect_verify('REMOTE_BASE_SHA_MISMATCH',mutate_remote=lambda repo,remote,r,a:bare(remote,'update-ref','refs/heads/main',a['commitSha'],a['baseSha']))
          expect_verify('LOCAL_HEAD_MOVED_AFTER_PUBLICATION',mutate_repo=lambda repo,r,a:git(repo,'commit','--allow-empty','-qm','extra local commit'))
          expect_verify('LOCAL_WORKTREE_NOT_CLEAN_AFTER_PUBLICATION',mutate_repo=lambda repo,r,a:(repo/'src/other.txt').write_text('dirty\n'))
          print('CG15_NEGATIVE_MATRIX=PASS')
          PY

      - name: Stable asset syntax and governance cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool prevention/cg15/protocol.json >/dev/null
          python3 -m json.tool prevention/cg15/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ['prevention/cg15/publish_branch.py','prevention/cg15/verify_publication.py']: ast.parse(Path(p).read_text(),filename=p)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG15_CONSUMER_MUTATION=NONE'
          echo 'CG15_STABLE_ASSETS=PASS'
