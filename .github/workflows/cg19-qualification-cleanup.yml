name: CG-19 qualification cleanup

on:
  push:
    branches:
      - cg19/controlled-merge-authorization

permissions:
  contents: write

jobs:
  cleanup:
    name: cleanup-cg19-qualification-branch
    runs-on: ubuntu-24.04
    steps:
      - name: Verify qualified protocol and delete qualification branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='hvritual/engineering-governance'
          ref='heads/cg19-qualification/merge-authorization'
          api="https://api.github.com/repos/${repo}/git/refs/${ref}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
          if [ "$code" = '200' ]; then
            curl -fsS -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api"
          elif [ "$code" != '404' ]; then
            echo "unexpected pre-cleanup status: $code" >&2
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
          test "$code" = '404'
          main_sha="$(git ls-remote https://github.com/${repo}.git refs/heads/main | cut -f1)"
          test "$main_sha" = '3861af38d52a9420d7c6d9039f4605c2861ecb42'
          echo 'CG19_QUALIFICATION_BRANCH_CLEANUP=PASS'
          echo 'CG19_MAIN_UNCHANGED=PASS'
