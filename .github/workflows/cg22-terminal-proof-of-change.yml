name: CG-22 terminal Proof-of-Change qualification

on:
  push:
    branches:
      - cg22/terminal-proof-of-change

permissions:
  contents: read

jobs:
  qualify-terminal-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact CG-21 source authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:delivery/cg21/protocol.json)" = "bf980728ab63b62e270acd1544cd4d83121707c5"
          test "$(git rev-parse HEAD:delivery/cg21/cases.json)" = "1bbf845a1506abd81d7e522c7b3ed049941190d0"
          test "$(git rev-parse HEAD:delivery/cg21/reconcile_completion.py)" = "e20b67f6cda9e8ebfdc6de7cd6ff60149bd042dd"
          test "$(git rev-parse HEAD:delivery/cg21/verify_completion.py)" = "45d6feff2baabe4449b977ce80864b84ec3a19ab"
          python3 - <<'PY'
          import json
          assert json.load(open('delivery/cg21/protocol.json'))['status']=='QUALIFIED'
          print('CG22_CG21_SOURCE_AUTHORITIES=PASS')
          PY

      - name: Qualify terminal Proof-of-Change rollup
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, sys
          from pathlib import Path

          root=Path('.').resolve()
          sys.path.insert(0,str(root/'delivery/cg21'))
          import reconcile_completion as r21
          import verify_completion as v21
          sys.path.insert(0,str(root/'delivery/cg22'))
          import build_proof as b22
          import verify_proof as v22

          protocol=json.load(open('delivery/cg22/protocol.json'))
          cases=json.load(open('delivery/cg22/cases.json'))
          cg21_protocol=json.load(open('delivery/cg21/protocol.json'))
          cg21_cases=json.load(open('delivery/cg21/cases.json'))
          cg07_protocol=json.load(open('delivery/cg07/protocol.json'))
          cg07_protocol_path=str(root/'delivery/cg07/protocol.json')
          cg07_verifier_path=str(root/'delivery/cg07/verify_post_merge.py')

          assert protocol['status'] in ('CANDIDATE','QUALIFIED')

          for case in cases['realCurrentStateRefusals']:
              try:
                  b22.validate_source(protocol,case['sourceCompletionAttestation'],case['sourceCompletionVerification'])
              except b22.ProofOfChangeError as exc:
                  assert exc.reason==case['expectedReason'],(case,exc.reason)
              else:
                  raise AssertionError('real subject unexpectedly CG22-eligible')
          print('CG22_REAL_CURRENT_STATE_REFUSAL=PASS')

          fixture=cg21_cases['qualificationFixture']
          execution_core=copy.deepcopy(fixture['sourceCore'])
          execution={
              **execution_core,
              'status':'MERGE_EXECUTION_ATTESTED',
              'decision':'CONTROLLED_MERGE_EXECUTION_VERIFIED',
              'executionAttestationId':r21.canonical_digest(execution_core),
          }
          observed=copy.deepcopy(fixture['observed'])
          completion=r21.reconcile(
              cg21_protocol,cg07_protocol,cg07_protocol_path,cg07_verifier_path,execution,observed
          )
          completion_verification=v21.verify(
              cg21_protocol,cg07_protocol,cg07_protocol_path,cg07_verifier_path,execution,observed,completion
          )
          proof=b22.build(protocol,completion,completion_verification)
          verification=v22.verify(protocol,completion,completion_verification,proof)

          q=cases['qualificationFixture']
          assert proof['status']=='PROOF_OF_CHANGE_ATTESTED'
          assert proof['decision']=='TERMINAL_PROOF_OF_CHANGE_VERIFIED'
          assert proof['proofType']==q['expectedProofType']
          assert proof['terminalState']==q['expectedTerminalState']
          assert proof['completionState']==q['expectedCompletionState']
          assert proof['recoveryDisposition']==q['expectedRecoveryDisposition']
          assert proof['completionAuthority']==q['expectedCompletionAuthority']
          assert proof['integrityAuthority']==q['expectedIntegrityAuthority']
          assert verification['status']=='PROOF_OF_CHANGE_VERIFICATION_ATTESTED'
          assert verification['decision']=='TERMINAL_PROOF_OF_CHANGE_RECONCILED'

          print('CG22_COMPLETION_ATTESTATION_ID='+completion['completionAttestationId'])
          print('CG22_COMPLETION_VERIFICATION_ID='+completion_verification['verificationId'])
          print('CG22_PROOF_ID='+proof['proofId'])
          print('CG22_PROOF_VERIFICATION_ID='+verification['verificationId'])
          print('CG22_TERMINAL_STATE='+proof['terminalState'])
          print('CG22_POSITIVE=PASS')

          def recompletion(value):
              core={k:v for k,v in value.items() if k not in {'status','decision','completionAttestationId'}}
              value['completionAttestationId']=b22.canonical_digest(core)

          def reverification(value):
              core={k:v for k,v in value.items() if k not in {'status','decision','verificationId'}}
              value['verificationId']=b22.canonical_digest(core)

          def reproof(value):
              core={k:v for k,v in value.items() if k not in {'status','decision','proofId'}}
              value['proofId']=b22.canonical_digest(core)

          def expect_source_reason(source,source_verification,reason):
              try:b22.validate_source(protocol,source,source_verification)
              except b22.ProofOfChangeError as exc:assert exc.reason==reason,(reason,exc.reason)
              else:raise AssertionError('source negative accepted: '+reason)

          bad=copy.deepcopy(completion); bad['completionAttestationId']='0'*64
          expect_source_reason(bad,completion_verification,'CG21_COMPLETION_ATTESTATION_ID_MISMATCH')

          bad=copy.deepcopy(completion); bad['completionState']='INCOMPLETE'; recompletion(bad)
          expect_source_reason(bad,completion_verification,'COMPLETION_STATE_NOT_TERMINAL')

          bad=copy.deepcopy(completion); bad['recoveryDisposition']='STOP_AND_INVESTIGATE'; recompletion(bad)
          expect_source_reason(bad,completion_verification,'RECOVERY_DISPOSITION_NOT_NO_ACTION')

          bad=copy.deepcopy(completion); bad['integrityAuthority']='CG22'; recompletion(bad)
          expect_source_reason(bad,completion_verification,'INTEGRITY_AUTHORITY_DRIFT')

          bad=copy.deepcopy(completion); bad['executesRecovery']=True; recompletion(bad)
          expect_source_reason(bad,completion_verification,'SOURCE_AUTHORITY_ESCALATION')

          badv=copy.deepcopy(completion_verification); badv['verificationId']='0'*64
          expect_source_reason(completion,badv,'CG21_VERIFICATION_ID_MISMATCH')

          badv=copy.deepcopy(completion_verification); badv['completionAttestationId']='0'*64; reverification(badv)
          expect_source_reason(completion,badv,'CG21_VERIFICATION_COMPLETION_BINDING_MISMATCH')

          badp=copy.deepcopy(proof); badp['proofId']='0'*64
          try:v22.verify(protocol,completion,completion_verification,badp)
          except v22.ProofVerificationError as exc:assert exc.reason=='PROOF_ID_MISMATCH',exc.reason
          else:raise AssertionError('tampered proof digest accepted')

          badp=copy.deepcopy(proof); badp['changedPaths']=['src/other.txt']; reproof(badp)
          try:v22.verify(protocol,completion,completion_verification,badp)
          except v22.ProofVerificationError as exc:assert exc.reason=='PROOF_RECONCILIATION_MISMATCH',exc.reason
          else:raise AssertionError('proof path drift accepted')

          badp=copy.deepcopy(proof); badp['executesRecovery']=True; reproof(badp)
          try:v22.verify(protocol,completion,completion_verification,badp)
          except v22.ProofVerificationError as exc:assert exc.reason=='PROOF_AUTHORITY_ESCALATION',exc.reason
          else:raise AssertionError('proof authority escalation accepted')

          badp=copy.deepcopy(proof); badp['sourceCompletionAttestationId']='0'*64; reproof(badp)
          try:v22.verify(protocol,completion,completion_verification,badp)
          except v22.ProofVerificationError as exc:assert exc.reason=='PROOF_SOURCE_COMPLETION_BINDING_MISMATCH',exc.reason
          else:raise AssertionError('proof source completion drift accepted')

          print('CG22_NEGATIVE_MATRIX=PASS')
          print('CG22_CONSUMER_MUTATION=NONE')
          print('CG22_MAIN_MUTATION=NONE')
          PY

      - name: Stable asset syntax and branch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool delivery/cg22/protocol.json >/dev/null
          python3 -m json.tool delivery/cg22/cases.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ['delivery/cg22/build_proof.py','delivery/cg22/verify_proof.py']:
              ast.parse(Path(p).read_text(),filename=p)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'CG22_STABLE_ASSETS=PASS'
